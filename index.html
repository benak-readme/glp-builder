/* swatch + hex; empty = "use the default" (slashed swatch), like ReadMe's */
function ColorValue({ value, onChange, label }) {
  const [txt, setTxt] = useState(value || "");
  useEffect(() => { setTxt(value || ""); }, [value]);
  const valid = normHex(txt);
  return (
    <div className={"glp-cval" + (txt && !valid ? " bad" : "")}>
      <label className={"glp-cval__sw" + (value ? "" : " empty")} style={value ? { background: value } : undefined} title={"Pick " + label}>
        {!value && <i className="fa-solid fa-slash" aria-hidden="true"></i>}
        <input type="color" value={normHex(value) || "#213aff"} onChange={(e) => onChange(e.target.value)} aria-label={"Pick " + label} />
      </label>
      <input className="glp-cval__hex" value={txt} placeholder="Default" spellCheck={false} aria-label={label + " hex"}
        onChange={(e) => { setTxt(e.target.value); const h = normHex(e.target.value); if (h) onChange(h); if (!e.target.value.trim()) onChange(""); }}
        onBlur={() => { if (txt && !normHex(txt)) setTxt(value || ""); }} />
    </div>
  );
}

/* ---------- font picker: ReadMe's font list, each option shown in its own face ---------- */
function FontSelect({ label, value, options, onChange, bare, firstLabel = "Match ReadMe", firstSub = "Whatever your hub uses" }) {
  const [open, setOpen] = useState(false);
  const list = FONT_FAMILIES[value] && !options.includes(value) ? [...options, value] : options; /* keep a legacy pick visible */
  const face = (n) => (n === "readme" ? "var(--font-ui)" : `'${n}', ${FONT_FALLBACK[FONT_FAMILIES[n].kind]}`);
  const name = (n) => (n === "readme" ? firstLabel : n + (FONT_FAMILIES[n] && FONT_FAMILIES[n].legacy ? " (older preset)" : ""));
  const body = (
      <div className="glp-fontsel">
        <button type="button" className={"glp-fontsel__btn" + (open ? " on" : "")} aria-haspopup="listbox" aria-expanded={open} onClick={() => setOpen(!open)}>
          <span style={{ fontFamily: face(value) }}>{name(value)}</span>
          <i className="fa-solid fa-chevron-down" aria-hidden="true"></i>
        </button>
        {open && (
          <>
            <div className="glp-pages__backdrop" onClick={() => setOpen(false)} />
            <div className="glp-fontsel__list" role="listbox" aria-label={label}>
              {["readme", ...list].map((n, i) => (
                <button key={n} type="button" role="option" aria-selected={value === n}
                  className={(value === n ? "on" : "") + (i === 0 ? " glp-fontsel__first" : "")}
                  onClick={() => { onChange(n); setOpen(false); }}>
                  <span style={{ fontFamily: face(n) }}>{name(n)}</span>
                  {n === "readme" && <small>{firstSub}</small>}
                  {value === n && <i className="fa-solid fa-check" aria-hidden="true"></i>}
                </button>
              ))}
            </div>
          </>
        )}
      </div>
  );
  return bare ? body : <Field label={label} inline>{body}</Field>;
}

/* ---------- inline-renamable row name (builder-only label, never on the page).
   Click the pencil or double-click the name; Enter/blur saves, Escape cancels,
   clearing it falls back to the section heading / "Section N". ---------- */
function RenameName({ value, fallback, onChange }) {
  const [editing, setEditing] = useState(false);
  const done = useRef(false);
  const stop = (e) => e.stopPropagation();
  const commit = (v) => { onChange(v.trim()); setEditing(false); };
  if (editing) {
    return (
      <input
        className="glp-input glp-rename"
        autoFocus
        defaultValue={value}
        placeholder={fallback}
        aria-label="Section name (builder only)"
        onClick={stop}
        onKeyDown={(e) => {
          e.stopPropagation();
          if (e.key === "Enter") { done.current = true; commit(e.target.value); }
          if (e.key === "Escape") { done.current = true; setEditing(false); }
        }}
        onBlur={(e) => { if (done.current) { done.current = false; return; } commit(e.target.value); }}
      />
    );
  }
  return (
    <span className="glp-card__name glp-namewrap" onDoubleClick={(e) => { e.stopPropagation(); setEditing(true); }} title="Double-click to rename (builder only)">
      <span className="glp-namewrap__text">{value || fallback}</span>
      <button type="button" className="glp-iconbtn glp-namewrap__btn" title="Rename (builder only)" aria-label="Rename section"
        onClick={(e) => { e.stopPropagation(); setEditing(true); }}>
        <i className="fa-solid fa-pen" aria-hidden="true"></i>
      </button>
    </span>
  );
}

/* ---------- shared collapsible row header (card / column / section) ---------- */
function RowHead({ noun, max, index, count, open, onToggle, onMove, onDuplicate, onRemove, dragHandleProps, dropRowProps, dragOver, children }) {
  const stop = (fn) => (e) => { e.stopPropagation(); fn(); };
  const btn = (title, icon, disabled, fn) => (
    <button className="glp-iconbtn" title={title} aria-label={title} disabled={disabled} onClick={stop(fn)} type="button">
      <i className={"fa-solid " + icon} aria-hidden="true"></i>
    </button>
  );
  return (
    <div
      className={"glp-card__head" + (dragOver ? " glp-drop-over" : "")}
      role="button"
      tabIndex={0}
      aria-expanded={open}
      onClick={onToggle}
      onKeyDown={(e) => {
        if (e.target !== e.currentTarget) return;
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onToggle(); }
      }}
      {...dropRowProps}
    >
      <span className="glp-drag-handle" title="Drag to reorder" onClick={(e) => e.stopPropagation()} {...dragHandleProps}>
        <i className="fa-solid fa-grip-vertical" aria-hidden="true"></i>
      </span>
      {children}
      {/* row actions float over the right edge and appear on hover/focus, so names get the full width */}
      <span className="glp-rowacts">
        {count > 1 && btn("Move up", "fa-arrow-up", index === 0, () => onMove(-1))}
        {count > 1 && btn("Move down", "fa-arrow-down", index === count - 1, () => onMove(1))}
        {btn("Duplicate " + noun, "fa-clone", count >= max, onDuplicate)}
        {count > 1 && btn("Delete " + noun, "fa-xmark", false, onRemove)}
      </span>
      <span className={"glp-iconbtn glp-chev" + (open ? " open" : "")} aria-hidden="true">
        <i className="fa-solid fa-chevron-right"></i>
      </span>
    </div>
  );
}

/* ---------- shared: editable list of { label, href } rows ---------- */
function LinkListEditor({ links, onChange, max = 8, labelPh = "Link text", hrefPh = "/path", addLabel = "+ Add link" }) {
  const list = links || [];
  const setRow = (i, p) => onChange(list.map((l, j) => (j === i ? { ...l, ...p } : l)));
  const move = (i, dir) => {
    const j = i + dir;
    if (j < 0 || j >= list.length) return;
    const arr = [...list];
    [arr[i], arr[j]] = [arr[j], arr[i]];
    onChange(arr);
  };
  return (
    <>
      {list.map((l, i) => (
        <div className="glp-peekitem glp-linkrow" key={i}>
          <input className="glp-input" value={l.label} placeholder={labelPh} onChange={(e) => setRow(i, { label: e.target.value })} />
          <input className="glp-input" value={l.href} placeholder={hrefPh} onChange={(e) => setRow(i, { href: e.target.value })} />
          <button className="glp-iconbtn" type="button" title="Move up" aria-label="Move up" disabled={i === 0} onClick={() => move(i, -1)}><i className="fa-solid fa-arrow-up" aria-hidden="true"></i></button>
          <button className="glp-iconbtn" type="button" title="Remove" aria-label="Remove" onClick={() => onChange(list.filter((_, j) => j !== i))}><i className="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </div>
      ))}
      {list.length < max && (
        <button className="glp-add glp-add--sm" type="button" onClick={() => onChange([...list, { label: "", href: "" }])}>
          {addLabel}
        </button>
      )}
    </>
  );
}

function CardEditor({ card, index, count, style, hideAccents, open, onToggle, onChange, onMove, onRemove, onDuplicate, dragHandleProps, dropRowProps, dragOver }) {
  const acc = cardAccent(card);
  const set = (patch) => onChange({ ...card, ...patch });

    const items = [...card.peekItems];
    items[i] = val;
    set({ peekItems: items });
  };
  return (
    <div className="glp-card">
      <RowHead noun="card" max={12} index={index} count={count} open={open} onToggle={onToggle}
        onMove={onMove} onDuplicate={onDuplicate} onRemove={onRemove} dragHandleProps={dragHandleProps} dropRowProps={dropRowProps} dragOver={dragOver}>
        <span className="glp-card__swatch" style={{ background: acc.light }} />
        <span className="glp-card__name">{card.title || "Untitled card"}</span>
        <span className="glp-card__meta">{card.href}</span>
      </RowHead>
      {open && (
        <div className="glp-card__body">
          <div className="glp-row2">
            <Field label="Title">
              <input className="glp-input" value={card.title} onChange={(e) => set({ title: e.target.value })} />
            </Field>
            <Field label="Link">
              <input className="glp-input" value={card.href} onChange={(e) => set({ href: e.target.value })} placeholder="my-project" />
            </Field>
          </div>
          <Field label="Description">
            <textarea className="glp-textarea" rows={2} placeholder={style.links ? "Blank to hide" : ""} value={card.blurb} onChange={(e) => set({ blurb: e.target.value })} />
          </Field>

          {style.links && (
            <>
              <Field label="Links (*word* for italics)">
                <LinkListEditor links={card.links} onChange={(links) => set({ links })} labelPh="Are you building with…?" />
              </Field>
              <Field label="Footnote">
                <input className="glp-input" value={card.note} onChange={(e) => set({ note: e.target.value })} placeholder="Don't have access yet?" />
              </Field>
              <div className="glp-row2">
                <Field label="Footnote link text">
                  <input className="glp-input" value={card.noteLinkLabel} onChange={(e) => set({ noteLinkLabel: e.target.value })} placeholder="Apply here" />
                </Field>
                <Field label="Footnote link">
                  <input className="glp-input" value={card.noteHref} onChange={(e) => set({ noteHref: e.target.value })} placeholder="https://…" />
                </Field>
              </div>
            </>

          {style.icon && <IconField label="Icon" obj={card} onChange={set} />}
          {style.badge && (
            <BadgeIconField
              eyebrowLabel="Badge text"
              eyebrow={card.eyebrow}
              badge={card.badge}
              onEyebrowChange={(v) => set({ eyebrow: v })}
              onBadgeChange={(v) => set({ badge: v })}
            />
          )}

          {!hideAccents && (
            <Field label="Accent color">
              <AccentSwatches selected={card.accent} onSelect={(k) => set({ accent: k })} customCard={card} onCustom={set} />
            </Field>
          )}

          {style.cta && (
            <CtaStyleFields
              textLabel="Button text"
              plainTextLabel="Link text"
              ctaText={card.ctaText}
              ctaStyle={card.ctaStyle}
              ctaPlain={style.ctaPlain}
              onTextChange={(v) => set({ ctaText: v })}
              onStyleChange={(v) => set({ ctaStyle: v })}
            />
          )}

          <Toggle
            checked={card.primary}
            onChange={(v) => set({ primary: v })}
            label="Highlight as the primary card"
            hint="Adds an accent-tinted border so this card reads as the main path."
          />

          {style.peek && (
            <>
              <Field label="List heading (e.g. Popular, Inside)">
                <input className="glp-input" value={card.peekLabel} onChange={(e) => set({ peekLabel: e.target.value })} />
              </Field>

                {card.peekItems.map((p, i) => (

                      className="glp-iconbtn"

                      onClick={() => set({ peekItems: card.peekItems.filter((_, j) => j !== i) })}
                    >
                      <i className="fa-solid fa-xmark" aria-hidden="true"></i>
                    </button>
                  </div>
                ))}
                {card.peekItems.length < 5 && (
                  <button className="glp-add glp-add--sm" type="button" onClick={() => set({ peekItems: [...card.peekItems, ""] })}>
                    + Add list item
                  </button>
                )}
              </Field>
              <Toggle
                checked={card.peekArrows}
                onChange={(v) => set({ peekArrows: v })}
                label="Arrow bullets"
                hint="Show a small → in the accent color before each list item."

              />
            </>
          )}
        </div>
      )}
    </div>
  );
}

/* ---------- single text-column editor ---------- */
function ColumnEditor({ column, index, count, open, onToggle, onChange, onMove, onRemove, onDuplicate, dragHandleProps, dropRowProps, dragOver }) {
  const set = (patch) => onChange({ ...column, ...patch });
  const ctas = column.ctas || [];
  const setCta = (i, patch) => set({ ctas: ctas.map((c, j) => (j === i ? { ...c, ...patch } : c)) });
  const addCta = () => set({ ctas: [...ctas, makeCta()] });
  const removeCta = (i) => set({ ctas: ctas.filter((_, j) => j !== i) });
  return (
    <div className="glp-card">
      <RowHead noun="column" max={4} index={index} count={count} open={open} onToggle={onToggle}
        onMove={onMove} onDuplicate={onDuplicate} onRemove={onRemove} dragHandleProps={dragHandleProps} dropRowProps={dropRowProps} dragOver={dragOver}>
        <span className="glp-card__name">{column.heading || `Column ${index + 1}`}</span>
      </RowHead>
      {open && (
        <div className="glp-card__body">
          <Field label="Heading (blank to hide)">
            <input className="glp-input" value={column.heading} onChange={(e) => set({ heading: e.target.value })} />
          </Field>
          <Field label="Body text (blank to hide)">
            <textarea className="glp-textarea" value={column.body} onChange={(e) => set({ body: e.target.value })} />
          </Field>
          <Field label="Calls to action">
            {ctas.length === 0 && (
              <p className="glp-hint" style={{ margin: "0 0 8px" }}>No CTAs yet. Add one or more links/buttons below.</p>
            )}
            {ctas.map((cta, i) => (
              <div key={i} className="glp-subcard">
                <div className="glp-row2">
                  <Field label="CTA text">
                    <input className="glp-input" value={cta.label} onChange={(e) => setCta(i, { label: e.target.value })} />
                  </Field>
                  <Field label="CTA link">
                    <input className="glp-input" value={cta.href} onChange={(e) => setCta(i, { href: e.target.value })} placeholder="/guides" />
                  </Field>
                </div>
                <div style={{ display: "flex", alignItems: "flex-end", gap: 10 }}>
                  <Field label="CTA style" style={{ flex: 1 }}>
                    <Seg
                      value={cta.style === "button" ? "button" : cta.style === "filled" ? "filled" : "plain"}
                      onChange={(v) => setCta(i, { style: v })}
                      options={[
                        { value: "plain", label: "Plain link" },
                        { value: "button", label: "Outline" },
                        { value: "filled", label: "Filled" },
                      ]}
                    />
                  </Field>
                  <button className="glp-iconbtn" title="Remove CTA" aria-label="Remove CTA" type="button" onClick={() => removeCta(i)}><i className="fa-solid fa-xmark" aria-hidden="true"></i></button>
                </div>
              </div>
            ))}
            <button className="glp-add" type="button" onClick={addCta}>+ Add CTA</button>
          </Field>
        </div>
      )}
    </div>
  );
}

/* ---------- section editor ---------- */
function SectionEditor({ section, index, count, hideAccents, globalStyle, open, onToggle, onMove, onRemove, onDuplicate, onChange, cardOps, openCard, setOpenCard, dragHandleProps, dropRowProps, dragOver }) {
  const set = (patch) => onChange({ ...section, ...patch });
  const setStyle = (patch) => onChange({ ...section, style: { ...section.style, ...patch } });
  const setLay = (patch) => onChange({ ...section, layout: { ...section.layout, ...patch } });
  const setLiq = (patch) => onChange({ ...section, liquid: { ...section.liquid, ...patch } });
  const isCols = section.type === "columns";
  const [tabSel, setTab] = useState("content");
  const tab = isCols && tabSel === "style" ? "content" : tabSel;
  /* the style that actually renders this section's cards: its own or the global one */
  const est = section.styleMode === "custom" ? section.style : globalStyle;
  const liquidOn = section.source === "liquid";
  const toggleLiqAccent = (key) =>
    setLiq({
      accents: section.liquid.accents.includes(key)
        ? section.liquid.accents.length > 1
          ? section.liquid.accents.filter((k) => k !== key)
          : section.liquid.accents
        : [...section.liquid.accents, key],
    });
  const colOps = {
    set: (id, next) => set({ columns: section.columns.map((c) => (c.id === id ? next : c)) }),
    move: (id, dir) => {
      const i = section.columns.findIndex((c) => c.id === id);
      const j = i + dir;
      if (j < 0 || j >= section.columns.length) return;
      const arr = [...section.columns];
      [arr[i], arr[j]] = [arr[j], arr[i]];
      set({ columns: arr });
    },
    reorderTo: (id, toIndex) => set({ columns: reorderById(section.columns, id, toIndex) }),
    remove: (id) => { if (section.columns.length > 1) set({ columns: section.columns.filter((c) => c.id !== id) }); },
    add: () => {
      if (section.columns.length >= 4) return;
      const col = makeColumn();
      setOpenCard(col.id);
      set({ columns: [...section.columns, col] });
    },
    duplicate: (id) => {
      if (section.columns.length >= 4) return;
      const i = section.columns.findIndex((c) => c.id === id);
      if (i < 0) return;
      const copy = { ...section.columns[i], id: uid(), ctas: (section.columns[i].ctas || []).map((c) => ({ ...c })) };
      const arr = [...section.columns];
      arr.splice(i + 1, 0, copy);
      setOpenCard(copy.id);
      set({ columns: arr });
    },
  };
  const colDrag = useDragReorder(colOps.reorderTo);
  const cardDrag = useDragReorder(cardOps.reorderTo);

  return (
    <div className="glp-card glp-section">
      <RowHead noun="section" max={6} index={index} count={count} open={open} onToggle={onToggle}
        onMove={onMove} onDuplicate={onDuplicate} onRemove={onRemove} dragHandleProps={dragHandleProps} dropRowProps={dropRowProps} dragOver={dragOver}>
        <RenameName value={section.label} fallback={section.heading || `Section ${index + 1}`} onChange={(v) => set({ label: v })} />
        <span className="glp-card__meta">{isCols ? section.columns.length + " cols" : liquidOn ? "auto" : section.cards.length + " cards"}</span>
      </RowHead>
      {open && (
        <div className="glp-card__body">
          <div className="glp-subtabs" role="tablist" aria-label="Section settings">
            {[["content", "Content"], ["layout", "Layout"], ...(isCols ? [] : [["style", "Card style"]])].map(([k, l]) => (
              <button key={k} type="button" role="tab" aria-selected={tab === k} className={tab === k ? "on" : ""} onClick={() => setTab(k)}>{l}</button>
            ))}
          </div>

          {tab === "content" && (
            <>
              <Field label="Heading">
                <input className="glp-input" value={section.heading} onChange={(e) => set({ heading: e.target.value })} placeholder="Blank to hide" />
              </Field>
              <Field label="Intro">
                <textarea className="glp-textarea" rows={2} value={section.intro} onChange={(e) => set({ intro: e.target.value })} placeholder="Blank to hide" />
              </Field>
              <Field label="Type" inline>
                <Seg
                  value={isCols ? "columns" : "cards"}
                  onChange={(v) => set({ type: v })}
                  options={[
                    { value: "cards", label: "Cards" },
                    { value: "columns", label: "Text columns" },
                  ]}
                />
              </Field>
              {isCols ? (
                <>
                  <div className="glp-sub">Columns</div>
              {section.columns.map((col, i) => (
                <ColumnEditor
                  key={col.id}
                  column={col}
                  index={i}
                  count={section.columns.length}
                  open={openCard === col.id}
                  onToggle={() => setOpenCard(openCard === col.id ? null : col.id)}
                  onChange={(next) => colOps.set(col.id, next)}
                  onMove={(dir) => colOps.move(col.id, dir)}
                  onRemove={() => colOps.remove(col.id)}
                  onDuplicate={() => colOps.duplicate(col.id)}
                  dragHandleProps={colDrag.dragHandleProps(col.id)}
                  dropRowProps={colDrag.dropRowProps(i)}
                  dragOver={colDrag.overIndex === i}
                />
              ))}
              <button className="glp-add" type="button" onClick={colOps.add} disabled={section.columns.length >= 4}>
                + Add column ({section.columns.length}/4)
              </button>
                </>
              ) : (
                <>
                  <Field label="Cards" inline>
                    <Seg
                      value={section.source}
                      onChange={(v) => set({ source: v })}
                      options={[
                        { value: "static", label: "Manual" },
                        { value: "liquid", label: "Auto from projects" },
                      ]}
                    />
                  </Field>
              {liquidOn ? (
                <LiquidControls section={section} st={est} setLiq={setLiq} toggleLiqAccent={toggleLiqAccent} hideAccents={hideAccents} />
              ) : (
                <>
                  {section.cards.map((card, i) => (
                    <CardEditor
                      key={card.id}
                      card={card}
                      index={i}
                      count={section.cards.length}
                      style={est}
                      hideAccents={hideAccents}
                      open={openCard === card.id}
                      onToggle={() => setOpenCard(openCard === card.id ? null : card.id)}
                      onChange={(next) => cardOps.set(card.id, next)}
                      onMove={(dir) => cardOps.move(card.id, dir)}
                      onRemove={() => cardOps.remove(card.id)}
                      onDuplicate={() => cardOps.duplicate(card.id)}
                      dragHandleProps={cardDrag.dragHandleProps(card.id)}
                      dropRowProps={cardDrag.dropRowProps(i)}
                      dragOver={cardDrag.overIndex === i}
                    />
                  ))}
                  <button className="glp-add" type="button" onClick={cardOps.add} disabled={section.cards.length >= 12}>
                    + Add card ({section.cards.length}/12)
                  </button>
                </>
              )}
                </>
              )}
            </>
          )}

          {tab === "layout" && (
            <>
              <Field label="Alignment" inline>
                <Seg
                  value={section.align}
                  onChange={(v) => set({ align: v })}
                  options={[
                    { value: "center", label: "Centered" },
                    { value: "left", label: "Left" },
                  ]}
                />
              </Field>
              <Field label="Background" inline>
                <Seg
                  value={section.layout.bg || "none"}
                  onChange={(v) => setLay({ bg: v })}
                  options={[
                    { value: "none", label: "None" },
                    { value: "subtle", label: "Subtle" },
                    { value: "accent", label: "Accent" },
                    { value: "dark", label: "Dark" },
                  ]}
                />
              </Field>
              <Slider label="Space above" value={section.layout.spaceAbove == null ? 36 : section.layout.spaceAbove} min={0} max={160} step={2} onChange={(v) => setLay({ spaceAbove: v })} />
              <Field label="Divider above" inline>
                <Seg
                  value={!section.layout.divider ? "none" : section.layout.dividerStyle === "accent" ? "accent" : "hairline"}
                  onChange={(v) => setLay(v === "none" ? { divider: false } : { divider: true, dividerStyle: v })}
                  options={[
                    { value: "none", label: "None" },
                    { value: "hairline", label: "Hairline" },
                    { value: "accent", label: "Accent" },
                  ]}
                />
              </Field>
              {isCols ? (
                <Slider label="Column gap" value={section.layout.gap} min={12} max={56} onChange={(v) => setLay({ gap: v })} />
              ) : (
                <>
                  {!section.layout.bento && (
                    <Slider label="Min card width" value={section.layout.colMin} min={180} max={420} onChange={(v) => setLay({ colMin: v })} />
                  )}
                  <Slider label="Card gap" value={section.layout.gap} min={12} max={36} onChange={(v) => setLay({ gap: v })} />
                  {!section.layout.autoH && (
                    <Slider label="Min card height" value={section.layout.cardMinH} min={140} max={800} step={4} onChange={(v) => setLay({ cardMinH: v })} />
                  )}
                  <div className="glp-toggles2">
                    <Toggle checked={section.layout.bento} onChange={(v) => setLay({ bento: v })} label="Bento grid" hint="Asymmetric mixed-size 6-column layout." />
                    <Toggle checked={section.layout.autoH} onChange={(v) => setLay({ autoH: v })} label="Auto height" hint="Let content decide card height instead of a fixed minimum." />
                  </div>
                </>
              )}
            </>
          )}

          {tab === "style" && !isCols && (
            <>
              <Field label="Look" inline>
                <Seg
                  value={section.styleMode === "custom" ? "custom" : "global"}
                  onChange={(v) => set({ styleMode: v })}
                  options={[
                    { value: "global", label: "Global" },
                    { value: "custom", label: "Custom" },
                  ]}
                />
              </Field>
              {section.styleMode === "custom" ? (
                <CardStyleControls style={section.style} setStyle={setStyle} liquid={liquidOn} />
              ) : (
                <div className="glp-note">
                  Using the <b>global card style</b> from Theme&nbsp;Editor, shared by every Global section. Switch to <b>Custom</b> to change just this one.
                </div>
              )}
            </>
          )}
        </div>
      )}
    </div>
  );
}

/* ---------- preview pane ---------- */
function Preview({ html, mode, setMode, device, setDevice, liquidNote, focusIndex }) {
  const editable = html.includes("data-glp=");
  /* Double-buffered preview: render the new doc into the hidden iframe and
     only reveal it once it has finished loading, so the visible frame never
     blanks (which read as a flash on every edit). */
  const [slots, setSlots] = useState(() => [buildPreviewDoc(expandLiquidForPreview(html), mode), ""]);
  const [active, setActive] = useState(0);
  const activeRef = useRef(0);
  activeRef.current = active;
  const frames = useRef([null, null]);
  /* remember where the user has scrolled the visible preview so a swap (which
     loads a brand-new iframe, always starting at the top) can restore it —
     otherwise every edit snaps the preview back to the top. */
  const scrollRef = useRef({ x: 0, y: 0 });
  /* mirror of `slots` for the timeout below so it never reads stale state
     (the effect only re-runs on html/mode, but slots also changes on swap) */
  const slotsRef = useRef(slots);
  slotsRef.current = slots;
  const captureScroll = () => {
    const f = frames.current[activeRef.current];
    try {
      if (f && f.contentWindow) scrollRef.current = { x: f.contentWindow.scrollX, y: f.contentWindow.scrollY };
    } catch (e) {}
  };
  const restoreScroll = (i) => {
    try {
      const f = frames.current[i];
      if (f && f.contentWindow) f.contentWindow.scrollTo(scrollRef.current.x, scrollRef.current.y);
    } catch (e) {}
  };
  useEffect(() => {
    const t = setTimeout(() => {
      const doc = buildPreviewDoc(expandLiquidForPreview(html), mode);
      const cur = activeRef.current;
      const back = cur === 0 ? 1 : 0;
      const s = slotsRef.current;
      if (s[cur] === doc) return; // already the visible doc — nothing to do
      captureScroll();
      if (s[back] === doc) {
        /* the hidden buffer already holds this exact doc (e.g. you toggled a
           switch back off, or dragged a slider back to a prior value) — writing
           it again is a no-op that fires no load event, so the visible frame
           would stay stale. Reveal the buffer we already have instead. */
        restoreScroll(back);
        setActive(back);
        return;
      }
      setSlots(back === 0 ? [doc, s[1]] : [s[0], doc]);
    }, 250);
    return () => clearTimeout(t);
  }, [html, mode]);
  const onFrameLoad = (i) => {
    if (i === activeRef.current || !slotsRef.current[i]) return; // only react to the freshly-loaded back buffer
    restoreScroll(i); // restore the captured scroll onto the incoming frame before revealing it
    setActive(i);
  };
  /* when a section is selected in the builder, scroll the preview to it and flash it */
  useEffect(() => {
    if (focusIndex == null) return;
    const t = setTimeout(() => {
      const f = frames.current[activeRef.current];
      try {
        const el = f && f.contentDocument && f.contentDocument.querySelector(".bnk-sec-" + focusIndex);
        if (!el) return;
        el.scrollIntoView({ behavior: "smooth", block: "start" });
        el.classList.remove("bnk-flash");
        void el.offsetWidth; // restart the animation if it was mid-flight
        el.classList.add("bnk-flash");
        setTimeout(() => { try { el.classList.remove("bnk-flash"); } catch (e) {} }, 1500);
      } catch (e) {}
    }, 90);
    return () => clearTimeout(t);
  }, [focusIndex]);
  return (
    <div className="glp-view">
      <div className="glp-view__bar">
        <span className="glp-view__label">Live preview</span>
        <Seg
          value={mode}
          onChange={setMode}
          options={[
            { value: "light", label: <><i className="fa-solid fa-sun" aria-hidden="true"></i> Light</> },
            { value: "dark", label: <><i className="fa-solid fa-moon" aria-hidden="true"></i> Dark</> },
          ]}
        />
        <Seg
          value={device}
          onChange={setDevice}
          options={[
            { value: "desktop", label: "Desktop" },
            { value: "mobile", label: "Mobile" },
          ]}
        />
        {(() => {
          const note = (editable ? "Click any text to edit it. " : "") + (liquidNote ? "Liquid preview shows 3 sample projects; ReadMe renders your real ones" : "Header, search & Ask AI are stand-ins for ReadMe's hub chrome");
          return <span className="glp-view__note" title={note}>{note}</span>;
        })()}
      </div>
      <div className="glp-view__framewrap">
        <div className="glp-framestack">
          {[0, 1].map((i) => (
            <iframe
              key={i}
              ref={(el) => { frames.current[i] = el; }}
              className={"glp-frame" + (device === "mobile" ? " mobile" : "") + (i === active ? " on" : "")}
              title="Landing page preview"
              sandbox="allow-scripts allow-same-origin"
              srcDoc={slots[i]}
              onLoad={() => onFrameLoad(i)}
            />
          ))}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   IMPORT WITH CLAUDE — no API key: Claude (on the user's own login) does the
   work and hands the builder a design. Two routes:
   1. the /mcp connector (Claude returns a /g/<code> link)
   2. copy a prompt into Claude, paste the JSON reply back here
   ============================================================ */
const BUILDER_ORIGIN = (() => {
  try { return /^https?:/.test(window.location.protocol) ? window.location.origin : "https://glp-builder.netlify.app"; }
  catch (e) { return "https://glp-builder.netlify.app"; }
})();

/* pull the design object out of whatever Claude replied (fenced block or bare JSON) */
function extractDesign(reply) {
  const fence = reply.match(/```(?:json)?\s*([\s\S]*?)```/i);
  let txt = fence ? fence[1] : reply;
  const a = txt.indexOf("{"), b = txt.lastIndexOf("}");
  if (a < 0 || b <= a) throw new Error("Couldn't find any JSON in that reply.");
  let obj;
  try { obj = JSON.parse(txt.slice(a, b + 1)); } catch (e) { throw new Error("The JSON in that reply didn't parse. Ask Claude to resend only the JSON."); }
  if (obj && obj.design && Array.isArray(obj.design.sections)) obj = obj.design;
  if (!obj || !Array.isArray(obj.sections)) throw new Error("That JSON isn't a builder design (it needs a sections list).");
  return obj;
}

function ImportDialog({ onClose, onCreate }) {
  const [tab, setTab] = useState("connector");
  const [url, setUrl] = useState("");
  const [reply, setReply] = useState("");
  const [err, setErr] = useState("");
  const [copied, setCopied] = useState("");
  const [guide, setGuide] = useState(null);
  const mcpUrl = BUILDER_ORIGIN + "/mcp";
  useEffect(() => {
    fetch("design-guide.md").then((r) => (r.ok ? r.text() : null)).then(setGuide).catch(() => setGuide(null));
  }, []);
  useEffect(() => {
    const k = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  }, []);
  const copy = async (t, which) => {
    try { await navigator.clipboard.writeText(t); setCopied(which); setTimeout(() => setCopied(""), 1600); } catch (e) {}
  };
  const target = url.trim() ? url.trim() : "[paste the landing page URL here]";
  const prompt =
    `Recreate the docs landing page at ${target} as a GLP Builder design (for a ReadMe Enterprise Global Landing Page).\n\n` +
    `Read the page, then follow the design guide ${guide ? "below" : `at ${BUILDER_ORIGIN}/design-guide.md`} exactly. ` +
    `Reply with ONLY the design JSON in a single \`\`\`json code block, no commentary.` +
    (guide ? `\n\n---\n\n${guide}` : "");
  const create = () => {
    try { setErr(""); onCreate(extractDesign(reply)); }
    catch (e) { setErr(e.message); }
  };
  return (
    <div className="glp-modal" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="glp-modal__box" role="dialog" aria-modal="true" aria-label="Import with Claude">
        <div className="glp-modal__head">
          <b><i className="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i> Import with Claude</b>
          <button className="glp-iconbtn" type="button" aria-label="Close" onClick={onClose}><i className="fa-solid fa-xmark" aria-hidden="true"></i></button>
        </div>
        <p className="glp-modal__lede">Give Claude any docs landing page and it rebuilds it here as a design you can edit. Uses your normal Claude login.</p>
        <Seg value={tab} onChange={setTab} options={[{ value: "connector", label: "Connector (recommended)" }, { value: "prompt", label: "Copy a prompt" }]} />

        {tab === "connector" ? (
          <div className="glp-modal__body">
            <ol className="glp-steps">
              <li>In Claude, open <b>Settings → Connectors</b>, find <b>GLP Builder</b>, and click <b>Connect</b>. It's already set up for everyone at ReadMe.</li>
              <li>In any chat, ask something like <i>"Recreate developer.acme.com as a GLP Builder page."</i></li>
              <li>Claude replies with a builder link. Open it, then click <b>Save as a page</b>.</li>
            </ol>
            <details className="glp-more">
              <summary>Not listed in your Claude?</summary>
              <p>Add it yourself under <b>Settings → Connectors → Add custom connector</b> with this URL:</p>
              <div className="glp-copyrow">
                <code>{mcpUrl}</code>
                <button className="glp-smallbtn" type="button" onClick={() => copy(mcpUrl, "mcp")}>
                  <i className={"fa-solid " + (copied === "mcp" ? "fa-check" : "fa-copy")} aria-hidden="true"></i> {copied === "mcp" ? "Copied" : "Copy"}
                </button>
              </div>
            </details>
          </div>
        ) : (
          <div className="glp-modal__body">
            <Field label="1. Page to recreate">
              <input className="glp-input" value={url} onChange={(e) => setUrl(e.target.value)} placeholder="https://developer.acme.com" />
            </Field>
            <div className="glp-copyrow" style={{ marginBottom: 14 }}>
              <button className="glp-copy" type="button" onClick={() => copy(prompt, "prompt")}>
                <i className={"fa-solid " + (copied === "prompt" ? "fa-check" : "fa-copy")} aria-hidden="true"></i> {copied === "prompt" ? "Prompt copied" : "2. Copy prompt"}
              </button>
              <a className="glp-smallbtn" href="https://claude.ai/new" target="_blank" rel="noopener noreferrer">
                <i className="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i> Open Claude
              </a>
            </div>
            <Field label="3. Paste Claude's reply">
              <textarea className="glp-textarea" style={{ minHeight: 140, fontFamily: "var(--font-mono)", fontSize: 12 }} value={reply} onChange={(e) => setReply(e.target.value)} placeholder="```json { ... } ```" />
            </Field>
            {err && <div className="glp-modal__err"><i className="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> {err}</div>}
            <button className="glp-copy" type="button" disabled={!reply.trim()} onClick={create}>
              <i className="fa-solid fa-file-circle-plus" aria-hidden="true"></i> Create page
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const boot = useRef(null);
  if (!boot.current) boot.current = loadInitialState();
  const [tab, setTab] = useState("build");
  const [config, setConfig] = useState(boot.current.config);
  const [override, setOverride] = useState(boot.current.override);
  const [designs, setDesigns] = useState(boot.current.designs);
  const [currentId, setCurrentId] = useState(boot.current.currentId);
  const [sharedView, setSharedView] = useState(boot.current.sharedView);
  const [pagesOpen, setPagesOpen] = useState(false);
  const [renaming, setRenaming] = useState(false);
  /* Enter/Escape already resolve the rename (commit/cancel); the ref stops the blur
     that follows (React unmounting the input) from committing or double-committing */
  const renameHandled = useRef(false);
  const [openCard, setOpenCard] = useState(null);
  /* builder appearance (not the page being built). The preference is
     "system" (default: follow the OS light/dark setting, live), "light" or
     "midnight"; `ui` is what actually renders. */
  const [uiPref, setUiPref] = useState(() => {
    try { const v = localStorage.getItem("glp-builder:ui"); return v === "light" || v === "midnight" ? v : "system"; } catch (e) { return "system"; }
  });
  const darkQuery = () => { try { return window.matchMedia("(prefers-color-scheme: dark)"); } catch (e) { return null; } };
  const [sysDark, setSysDark] = useState(() => { const q = darkQuery(); return !!(q && q.matches); });
  useEffect(() => {
    const q = darkQuery();
    if (!q) return;
    const on = (e) => setSysDark(e.matches);
    q.addEventListener ? q.addEventListener("change", on) : q.addListener(on);
    return () => (q.removeEventListener ? q.removeEventListener("change", on) : q.removeListener(on));
  }, []);
  const ui = uiPref === "system" ? (sysDark ? "midnight" : "light") : uiPref;
  const [uiMenu, setUiMenu] = useState(false);
  const chooseUi = (v) => {
    setUiPref(v);
    setUiMenu(false);
    try { v === "system" ? localStorage.removeItem("glp-builder:ui") : localStorage.setItem("glp-builder:ui", v); } catch (e) {}
  };
  const [colorEdit, setColorEdit] = useState("light");
  const [openNav, setOpenNavRaw] = useState(() => {
    try { const v = localStorage.getItem("glp-builder:nav"); if (NAV_TABS.some((t) => t.id === v)) return v; } catch (e) {}
    return "sections";
  });
  const sideRef = useRef(null);
  const setOpenNav = (id) => {
    setOpenNavRaw(id);
    try { localStorage.setItem("glp-builder:nav", id); } catch (e) {}
    if (sideRef.current) sideRef.current.scrollTop = 0;
  };
  const [openSection, setOpenSection] = useState(boot.current.config.sections[0].id);
  const [mode, setMode] = useState("light");
  const [device, setDevice] = useState("desktop");
  const [copied, setCopied] = useState(false);
  const [shared, setShared] = useState(false);
  const [loadingShare, setLoadingShare] = useState(!!boot.current.pendingShare);
  const [shareError, setShareError] = useState(false);
  const [sharedName, setSharedName] = useState("");
  const [importOpen, setImportOpen] = useState(false);
  const [saveState, setSaveState] = useState("saved");
  const firstAutosave = useRef(true);
  const [histVer, setHistVer] = useState(0);
  const past = useRef([]);
  const future = useRef([]);
  const snapRef = useRef(config);
  const skipHist = useRef(false);

  const generated = useMemo(() => generateHTML(config), [config]);
  /* same page with data-glp hooks so text can be edited right in the preview */
  const previewHtml = useMemo(() => generateHTML(config, { editable: true }), [config]);
  const configRef = useRef(config);
  configRef.current = config;

  /* edits committed inside the preview iframe come back as { path, value } */
  useEffect(() => {
    const onMsg = (e) => {
      const d = e.data;
      if (!d || typeof d !== "object") return;
      const fromPreview = [...document.querySelectorAll("iframe.glp-frame")].some((f) => f.contentWindow === e.source);
      if (!fromPreview) return;
      if (d.type === "glp-focus-section" && Number.isInteger(d.index)) {
        const sec = configRef.current.sections[d.index];
        if (sec) { setOpenNav("sections"); setOpenSection(sec.id); }
        return;
      }
      if (d.type !== "glp-edit" || typeof d.path !== "string" || typeof d.value !== "string" || !EDITABLE_PATH_RE.test(d.path)) return;
      setConfig((c) => setAtPath(c, d.path.split("."), d.value.slice(0, 2000)));
    };
    window.addEventListener("message", onMsg);
    return () => window.removeEventListener("message", onMsg);
  }, []);
  const exportHtml = override ?? generated;

  const patch = (p) => setConfig((c) => ({ ...c, ...p }));
  const setHero = (p) => setConfig((c) => ({ ...c, hero: { ...c.hero, ...p } }));
  const setTicker = (p) => setConfig((c) => ({ ...c, ticker: { ...c.ticker, ...p } }));
  const setLayout = (p) => setConfig((c) => ({ ...c, layout: { ...c.layout, ...p } }));
  const setBanner = (p) => setConfig((c) => ({ ...c, banner: { ...c.banner, ...p } }));
  const setBrandBar = (p) => setConfig((c) => ({ ...c, brandBar: { ...c.brandBar, ...p } }));
  const setHeaderImage = (p) => setConfig((c) => ({ ...c, headerImage: { ...c.headerImage, ...p } }));
  const setTheme = (p) => setConfig((c) => ({ ...c, theme: { ...c.theme, ...p } }));
  const setCardStyle = (p) => setConfig((c) => ({ ...c, cardStyle: { ...(c.cardStyle || DEFAULT_STYLE), ...p } }));
  const applyPreset = (preset) => setConfig((c) => ({ ...c, cardStyle: { ...DEFAULT_STYLE, ...preset.style } }));

  /* ---- undo / redo history (rollback) ---- */
  useEffect(() => {
    if (skipHist.current) { skipHist.current = false; snapRef.current = config; return; }
    const t = setTimeout(() => {
      if (config !== snapRef.current) {
        past.current.push(snapRef.current);
        if (past.current.length > 60) past.current.shift();
        future.current = [];
        snapRef.current = config;
        setHistVer((v) => v + 1);
      }
    }, 600);
    return () => clearTimeout(t);
  }, [config]);

  const applyHistory = (cfg) => {
    skipHist.current = true;
    snapRef.current = cfg;
    setConfig(cfg);
    setOpenCard(null);
    setOpenSection((os) => (cfg.sections.some((s) => s.id === os) ? os : cfg.sections[0].id));
    setHistVer((v) => v + 1);
  };
  const undo = () => {
    /* fold any un-captured in-progress edit into history first */
    if (config !== snapRef.current) { past.current.push(snapRef.current); future.current = []; snapRef.current = config; }
    if (!past.current.length) return;
    future.current.push(config);
    applyHistory(past.current.pop());
  };
  const redo = () => {
    if (!future.current.length) return;
    past.current.push(config);
    applyHistory(future.current.pop());
  };
  const canUndo = past.current.length > 0 || config !== snapRef.current;
  const canRedo = future.current.length > 0;

  /* intentionally no dependency array: undo/redo/canUndo/canRedo close over `config` and
     the past/future refs, which change every edit — re-binding on every render keeps the
     listener's closure fresh instead of going stale behind a memoized dependency list */
  useEffect(() => {
    const h = (e) => {
      if (!(e.metaKey || e.ctrlKey) || e.key.toLowerCase() !== "z") return;
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return; // let native text undo win
      e.preventDefault();
      if (e.shiftKey) redo();
      else undo();
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  });

  /* ---- section ops ---- */
  const updateSection = (id, next) => setConfig((c) => ({ ...c, sections: c.sections.map((s) => (s.id === id ? next : s)) }));
  const moveSection = (id, dir) =>
    setConfig((c) => {
      const i = c.sections.findIndex((s) => s.id === id);
      const j = i + dir;
      if (j < 0 || j >= c.sections.length) return c;
      const arr = [...c.sections];
      [arr[i], arr[j]] = [arr[j], arr[i]];
      return { ...c, sections: arr };
    });
  const reorderSection = (id, toIndex) => setConfig((c) => ({ ...c, sections: reorderById(c.sections, id, toIndex) }));
  const sectionDrag = useDragReorder(reorderSection);
  const removeSection = (id) => setConfig((c) => (c.sections.length > 1 ? { ...c, sections: c.sections.filter((s) => s.id !== id) } : c));
  const addSection = () =>
    setConfig((c) => {
      if (c.sections.length >= 6) return c;
      const id = uid();
      const ns = {
        id,
        type: "cards",
        label: "",
        heading: "New section",
        intro: "",
        align: "center",
        source: "liquid",
        styleMode: "global",
        style: { ...DEFAULT_STYLE },
        layout: { ...DEFAULT_SECTION_LAYOUT },
        liquid: { ...DEFAULT_LIQUID },
        columns: DEFAULT_COLUMNS(),
        cards: [{ ...CARD_DEFAULTS, id: uid() }],
      };
      setOpenSection(id);
      return { ...c, sections: [...c.sections, ns] };
    });
  const duplicateSection = (id) =>
    setConfig((c) => {
      if (c.sections.length >= 6) return c;
      const i = c.sections.findIndex((s) => s.id === id);
      if (i < 0) return c;
      const src = c.sections[i];
      const copy = {
        ...src,
        id: uid(),
        style: { ...src.style },
        layout: { ...src.layout },
        liquid: { ...src.liquid, accents: [...src.liquid.accents] },
        columns: src.columns.map((col) => ({ ...col, id: uid(), ctas: (col.ctas || []).map((c) => ({ ...c })) })),
        cards: src.cards.map((k) => ({ ...k, id: uid(), peekItems: [...k.peekItems] })),
      };
      const arr = [...c.sections];
      arr.splice(i + 1, 0, copy);
      setOpenSection(copy.id);
      return { ...c, sections: arr };
    });

  /* ---- card ops scoped to a section ---- */
  const cardOpsFor = (secId) => ({
    set: (cardId, next) =>
      setConfig((c) => ({
        ...c,
        sections: c.sections.map((s) => (s.id !== secId ? s : { ...s, cards: s.cards.map((k) => (k.id === cardId ? next : k)) })),
      })),
    move: (cardId, dir) =>
      setConfig((c) => ({
        ...c,
        sections: c.sections.map((s) => {
          if (s.id !== secId) return s;
          const i = s.cards.findIndex((k) => k.id === cardId);
          const j = i + dir;
          if (j < 0 || j >= s.cards.length) return s;
          const arr = [...s.cards];
          [arr[i], arr[j]] = [arr[j], arr[i]];
          return { ...s, cards: arr };
        }),
      })),
    reorderTo: (cardId, toIndex) =>
      setConfig((c) => ({
        ...c,
        sections: c.sections.map((s) => (s.id !== secId ? s : { ...s, cards: reorderById(s.cards, cardId, toIndex) })),
      })),
    remove: (cardId) =>
      setConfig((c) => ({
        ...c,
        sections: c.sections.map((s) => (s.id !== secId ? s : s.cards.length > 1 ? { ...s, cards: s.cards.filter((k) => k.id !== cardId) } : s)),
      })),
    add: () =>
      setConfig((c) => ({
        ...c,
        sections: c.sections.map((s) => {
          if (s.id !== secId) return s;
          if (s.cards.length >= 12) return s;
          const id = uid();
          setOpenCard(id);
          return { ...s, cards: [...s.cards, { ...CARD_DEFAULTS, id }] };
        }),
      })),
    duplicate: (cardId) =>
      setConfig((c) => ({
        ...c,
        sections: c.sections.map((s) => {
          if (s.id !== secId || s.cards.length >= 12) return s;
          const i = s.cards.findIndex((k) => k.id === cardId);
          if (i < 0) return s;
          const copy = { ...s.cards[i], id: uid(), peekItems: [...s.cards[i].peekItems] };
          const arr = [...s.cards];
          arr.splice(i + 1, 0, copy);
          setOpenCard(copy.id);
          return { ...s, cards: arr };
        }),
      })),
  });

  /* ---- named designs / autosave ---- */
  const currentName = sharedView
    ? "Shared design"
    : ((designs.find((d) => d.id === currentId) || {}).name || "Untitled page");

  const stripHash = () => {
    try { window.history.replaceState(null, "", window.location.pathname + window.location.search); } catch (e) {}
  };
  /* excludeId lets renameCurrent check uniqueness against every OTHER page without
     tripping over the current page's own (soon-to-be-replaced) name */
  const uniqueName = (base, excludeId) => {
    const names = new Set(designs.filter((d) => d.id !== excludeId).map((d) => d.name));
    if (!names.has(base)) return base;
    let n = 2;
    while (names.has(`${base} ${n}`)) n++;
    return `${base} ${n}`;
  };

  const designsRef = useRef(designs);
  designsRef.current = designs;

  /* write the working page into its slot right now (used before switching pages so a
     pending debounced autosave can't be lost). Only bumps updatedAt on a real change. */
  const flushCurrent = () => {
    if (sharedView || !currentId) return designs;
    return designs.map((d) =>
      d.id === currentId && (JSON.stringify(d.config) !== JSON.stringify(config) || (d.override || "") !== (override ?? ""))
        ? { ...d, config, override: override ?? "", updatedAt: nowMs() }
        : d
    );
  };

  /* a different page is now in the editor: its undo stack starts empty, and the
     autosave that fires for the swap itself is skipped (nothing was edited) */
  const resetForPage = (cfg) => {
    past.current = [];
    future.current = [];
    skipHist.current = true;
    snapRef.current = cfg;
    firstAutosave.current = true;
    setHistVer((v) => v + 1);
  };

  /* autosave the working design into its slot (debounced); skipped while viewing a shared link */
  useEffect(() => {
    if (sharedView || !currentId) return;
    /* don't flash "Saving…" on first mount / page switch — only on real edits */
    if (firstAutosave.current) { firstAutosave.current = false; return; }
    setSaveState("saving");
    const t = setTimeout(() => {
      const next = designsRef.current.map((d) => (d.id === currentId ? { ...d, config, override: override ?? "", updatedAt: nowMs() } : d));
      const ok = persistDesigns(next, currentId);
      setDesigns(next);
      setSaveState(ok ? "saved" : "error");
    }, 500);
    return () => clearTimeout(t);
  }, [config, override, currentId, sharedView]);

  const switchTo = (id) => {
    const d = designs.find((x) => x.id === id);
    if (!d) return;
    if (id === currentId && !sharedView) { setPagesOpen(false); return; }
    const ds = flushCurrent();
    if (ds !== designs) { setDesigns(ds); persistDesigns(ds, id); }
    const cfg = migrateConfig(d.config);
    resetForPage(cfg);
    setConfig(cfg);
    setOverride(d.override || null);
    setCurrentId(id);
    setSharedView(false);
    setOpenSection(cfg.sections[0].id);
    setOpenCard(null);
    setPagesOpen(false);
    setRenaming(false);
    stripHash();
    try { localStorage.setItem(CURRENT_KEY, id); } catch (e) {}
  };

  const newPage = (template) => {
    const cfg = template ? template.build() : DEFAULT_CONFIG;
    const d = makeDesign(uniqueName(template ? template.label : "Untitled page"), cfg, "");
    const ds = [...flushCurrent(), d];
    setDesigns(ds);
    setSaveState(persistDesigns(ds, d.id) ? "saved" : "error");
    resetForPage(cfg);
    setConfig(cfg);
    setOverride(null);
    setCurrentId(d.id);
    setSharedView(false);
    setOpenSection(cfg.sections[0].id);
    setOpenCard(null);
    setPagesOpen(false);
    setRenaming(false);
    stripHash();
  };

  const duplicateCurrent = () => {
    const src = designs.find((d) => d.id === currentId);
    const d = makeDesign(uniqueName((src ? src.name : "Page") + " copy"), config, override ?? "");
    const ds = [...flushCurrent(), d];
    setDesigns(ds);
    setSaveState(persistDesigns(ds, d.id) ? "saved" : "error");
    setCurrentId(d.id);
    setSharedView(false);
    setPagesOpen(false);
    setRenaming(false);
    stripHash();
  };

  /* ---- file backup ---- */
  const fileHandle = useRef(null);
  /* off | on | reconnect | error | unsupported */
  const [fileState, setFileState] = useState(fsSupported() ? "off" : "unsupported");
  const [fileName, setFileName] = useState("");
  const [fileMsg, setFileMsg] = useState("");

  /* bring pages from a file into the list (merge; the newer copy of a page wins) */
  const adoptDesigns = (incoming) => {
    /* after a cache clear the builder auto-creates one blank page; drop it rather than keep a stray "Untitled page" */
    const cur0 = designsRef.current;
    const pristine = cur0.length === 1 && !cur0[0].override && JSON.stringify(cur0[0].config) === JSON.stringify(DEFAULT_CONFIG);
    const merged = mergeDesigns(pristine ? [] : cur0, incoming);
    setDesigns(merged);
    persistDesigns(merged, currentId);
    /* if nothing real was open (fresh after a cache clear), open the newest imported page */
    const cur = merged.find((d) => d.id === currentId);
    if (!cur || (merged.length > 1 && designsRef.current.length === 1 && JSON.stringify(cur.config) === JSON.stringify(DEFAULT_CONFIG))) {
      const newest = incoming.slice().sort((a, b) => b.updatedAt - a.updatedAt)[0];
      if (newest) {
        const cfg = migrateConfig(newest.config);
        resetForPage(cfg);
        setConfig(cfg);
        setOverride(newest.override || null);
        setCurrentId(newest.id);
        setSharedView(false);
        setOpenSection(cfg.sections[0].id);
        try { localStorage.setItem(CURRENT_KEY, newest.id); } catch (e) {}
      }
    }
    return merged;
  };

  const attachHandle = async (handle, readFirst) => {
    fileHandle.current = handle;
    setFileName(handle.name);
    let ds = designsRef.current;
    if (readFirst) {
      try {
        const text = await (await handle.getFile()).text();
        if (text.trim()) ds = adoptDesigns(parseDesignsFile(text));
      } catch (e) {
        setFileMsg(e.message || "Couldn't read that file.");
      }
    }
    await writeHandle(handle, ds);
    await idb("set", handle);
    setFileState("on");
  };

  const connectNewFile = async () => {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: "glp-designs.json", types: [{ description: "GLP Builder designs", accept: { "application/json": [".json"] } }] });
      setFileMsg("");
      await attachHandle(h, false);
    } catch (e) { if (e && e.name !== "AbortError") { setFileState("error"); setFileMsg(e.message); } }
  };
  const openExistingFile = async () => {
    try {
      const [h] = await window.showOpenFilePicker({ types: [{ description: "GLP Builder designs", accept: { "application/json": [".json"] } }] });
      if ((await h.requestPermission({ mode: "readwrite" })) !== "granted") return;
      setFileMsg("");
      await attachHandle(h, true);
    } catch (e) { if (e && e.name !== "AbortError") { setFileState("error"); setFileMsg(e.message); } }
  };
  const reconnectFile = async () => {
    const h = fileHandle.current;
    if (!h) return;
    try {
      if ((await h.requestPermission({ mode: "readwrite" })) === "granted") await attachHandle(h, true);
    } catch (e) { setFileState("error"); setFileMsg(e.message); }
  };
  const disconnectFile = async () => {
    fileHandle.current = null;
    await idb("del");
    setFileName("");
    setFileState("off");
  };

  /* boot: ask the browser not to evict our storage, and restore a previously chosen file */
  useEffect(() => {
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
    if (!fsSupported()) return;
    (async () => {
      const h = await idb("get");
      if (!h) return;
      fileHandle.current = h;
      setFileName(h.name);
      try {
        if ((await h.queryPermission({ mode: "readwrite" })) === "granted") await attachHandle(h, true);
        else setFileState("reconnect");
      } catch (e) { setFileState("reconnect"); }
    })();
  }, []);

  /* mirror every change to the page list into the file (debounced) */
  useEffect(() => {
    if (fileState !== "on" || !fileHandle.current) return;
    const t = setTimeout(() => {
      writeHandle(fileHandle.current, designs).catch(() => setFileState("reconnect"));
    }, 800);
    return () => clearTimeout(t);
  }, [designs, fileState]);

  const exportDesigns = () => {
    const blob = new Blob([designsFileJson(flushCurrent())], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "glp-designs-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 500);
  };
  const importInput = useRef(null);
  const importDesigns = async (file) => {
    if (!file) return;
    try {
      const incoming = parseDesignsFile(await file.text());
      adoptDesigns(incoming);
      setFileMsg(`Imported ${incoming.length} page${incoming.length === 1 ? "" : "s"}.`);
    } catch (e) { setFileMsg(e.message || "Couldn't read that file."); }
  };

  const saveSharedAsPage = () => {
    const d = makeDesign(uniqueName(sharedName || "Shared page"), config, override ?? "");
    const ds = [...designs, d];
    setDesigns(ds);
    setSaveState(persistDesigns(ds, d.id) ? "saved" : "error");
    setCurrentId(d.id);
    setSharedView(false);
    stripHash();
  };

  const renameCurrent = (name) => {
    const trimmed = (name || "").trim() || "Untitled page";
    const nm = uniqueName(trimmed, currentId);
    const ds = designs.map((d) => (d.id === currentId ? { ...d, name: nm } : d));
    setDesigns(ds);
    setSaveState(persistDesigns(ds, currentId) ? "saved" : "error");
    setRenaming(false);
  };

  const deleteCurrent = () => {
    try {
      if (!window.confirm(`Delete "${currentName}"? This can't be undone.`)) return;
    } catch (e) {}
    let ds = designs.filter((d) => d.id !== currentId);
    if (!ds.length) ds = [makeDesign("Untitled page", DEFAULT_CONFIG, "")];
    /* land on the most recently edited remaining page, matching the switcher's own
       sort order, rather than whatever happens to be first in array order */
    const target = ds.slice().sort((a, b) => b.updatedAt - a.updatedAt)[0];
    const cfg = migrateConfig(target.config);
    setDesigns(ds);
    setSaveState(persistDesigns(ds, target.id) ? "saved" : "error");
    resetForPage(cfg);
    setConfig(cfg);
    setOverride(target.override || null);
    setCurrentId(target.id);
    setSharedView(false);
    setOpenSection(cfg.sections[0].id);
    setOpenCard(null);
    setPagesOpen(false);
    setRenaming(false);
  };

  /* manual CODE-tab edits aren't in the undo history (only `config` is), so discarding
     them is the one destructive action in the app with no ⌘Z path back — confirm first */
  const discardOverride = () => {
    try {
      if (!window.confirm("Discard your manual HTML edits? This can't be undone.")) return;
    } catch (e) {}
    setOverride(null);
  };

  const copyText = async (text) => {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      } catch (e2) {
        return false;
      }
    }
  };

  const copy = useCallback(async () => {
    if (await copyText(exportHtml)) {
      setCopied(true);
      setTimeout(() => setCopied(false), 1800);
    }
  }, [exportHtml]);

  const download = useCallback(() => {
    const blob = new Blob([exportHtml], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "global-landing-page.html";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 500);
  }, [exportHtml]);

  const share = useCallback(async () => {
    if (override !== null) {
      try {
        if (!window.confirm("Share links carry the builder settings only, not your manual code edits. Share anyway?")) return;
      } catch (e) {}
    }
    const encoded = encodeConfig(config);
    let payload = encoded;
    const onWeb = (() => { try { return /^https?:/.test(window.location.protocol); } catch (e) { return false; } })();
    if (onWeb) {
      const base = window.location.origin + "/";
      /* the long inline link is the fallback if the short-link service is down */
      const inlineLink = base + "#c=" + encoded;
      payload = inlineLink;
      setShared("working");
      try {
        const res = await fetch("/.netlify/functions/share", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(config),
        });
        if (res.ok) {
          const { code } = await res.json();
          if (code) payload = base + "g/" + code;
        }
      } catch (e) {
        /* offline / local file / function unavailable — keep the inline link */
      }
    }
    if (await copyText(payload)) {
      setShared(true);
      setTimeout(() => setShared(false), 1800);
    } else {
      setShared(false);
    }
  }, [config, override]);

  /* a /g/<code> link: fetch the stored design and load it after boot */
  useEffect(() => {
    const code = boot.current.pendingShare;
    if (!code) return;
    let cancelled = false;
    (async () => {
      try {
        const res = await fetch("/.netlify/functions/share?id=" + encodeURIComponent(code));
        if (res.ok) {
          const raw = await res.json();
          const cfg = migrateConfig(raw);
          if (raw && raw._meta && typeof raw._meta.name === "string") setSharedName(raw._meta.name.slice(0, 80));
          if (!cancelled) { resetForPage(cfg); setConfig(cfg); setOpenSection(cfg.sections[0].id); }
        } else if (!cancelled) setShareError(true);
      } catch (e) {
        if (!cancelled) setShareError(true);
      }
      if (!cancelled) setLoadingShare(false);
    })();
    return () => { cancelled = true; };
  }, []);

  const hasLiquid = config.sections.some((s) => s.type !== "columns" && s.source === "liquid");

  return (
    <div className="glp" data-ui={ui}>
      <style>{APP_CSS}</style>

      {importOpen && (
        <ImportDialog
          onClose={() => setImportOpen(false)}
          onCreate={(obj) => {
            const nm = (obj._meta && obj._meta.name) || (obj.brandBar && obj.brandBar.name ? obj.brandBar.name + " (imported)" : "Imported page");
            newPage({ label: String(nm).slice(0, 80), build: () => migrateConfig(obj) });
            setImportOpen(false);
          }}
        />
      )}

      {loadingShare && (
        <div className="glp-shareload">
          <div className="glp-shareload__box">Loading shared design…</div>
        </div>
      )}

      <div className="glp-bar">
        <div className="glp-logo">
          <div className="glp-logo__mark" aria-hidden="true">
            {/* a tiny landing page: header bar over a row of cards */}
            <svg viewBox="0 0 20 20" width="18" height="18" fill="currentColor">
              <rect x="2" y="3" width="16" height="3.2" rx="1.2" />
              <rect x="2" y="8.4" width="4.6" height="8.6" rx="1.2" />
              <rect x="7.7" y="8.4" width="4.6" height="8.6" rx="1.2" opacity=".75" />
              <rect x="13.4" y="8.4" width="4.6" height="8.6" rx="1.2" opacity=".5" />
            </svg>
          </div>
          <div>
            <div className="glp-logo__name">GLP Builder</div>
            <div className="glp-logo__tag">Global landing pages for ReadMe Enterprise</div>
          </div>
        </div>
        <div className="glp-tabs">
          <button className={"glp-tab" + (tab === "build" ? " on" : "")} onClick={() => setTab("build")} type="button">
            Build
          </button>
          <button className={"glp-tab" + (tab === "code" ? " on" : "")} onClick={() => setTab("code")} type="button">
            Code
          </button>
        </div>
        <button className="glp-smallbtn glp-claudebtn" type="button" onClick={() => setImportOpen(true)}
          title="Bring any docs landing page into the builder as an editable design, using Claude">
          <i className="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
          <span>Import with Claude</span>
        </button>
        <div className="glp-bar__right">
          <div className="glp-uimenu">
            <button className={"glp-iconbtn glp-uitoggle" + (uiMenu ? " on" : "")} type="button" onClick={() => setUiMenu(!uiMenu)}
              title="Builder appearance" aria-label="Builder appearance" aria-haspopup="menu" aria-expanded={uiMenu}>
              <i className={"fa-solid " + (ui === "light" ? "fa-sun" : "fa-moon")} aria-hidden="true"></i>
            </button>
            {uiMenu && (
              <>
                <div className="glp-pages__backdrop" onClick={() => setUiMenu(false)} />
                <div className="glp-uimenu__list" role="menu" aria-label="Builder appearance">
                  {[
                    ["system", "fa-circle-half-stroke", "Match system"],
                    ["light", "fa-sun", "Light"],
                    ["midnight", "fa-moon", "Midnight"],
                  ].map(([v, icon, label]) => (
                    <button key={v} type="button" role="menuitemradio" aria-checked={uiPref === v} className={uiPref === v ? "on" : ""} onClick={() => chooseUi(v)}>
                      <i className={"fa-solid " + icon} aria-hidden="true"></i>
                      <span>{label}</span>
                      {uiPref === v && <i className="fa-solid fa-check glp-uimenu__check" aria-hidden="true"></i>}
                    </button>
                  ))}
                </div>
              </>
            )}
          </div>
          <button className="glp-smallbtn" type="button" title="Undo (⌘Z)" disabled={!canUndo} onClick={undo} aria-label="Undo" style={{ padding: "8px 11px" }}><i className="fa-solid fa-rotate-left" aria-hidden="true"></i></button>
          <button className="glp-smallbtn" type="button" title="Redo (⇧⌘Z)" disabled={!canRedo} onClick={redo} aria-label="Redo" style={{ padding: "8px 11px", marginRight: 8 }}><i className="fa-solid fa-rotate-right" aria-hidden="true"></i></button>
          {!sharedView && currentId && (
            <span
              className={"glp-save" + (saveState === "saved" ? " ok" : saveState === "error" ? " err" : "")}
              title={saveState === "error" ? "Browser storage is unavailable or full. This page only exists in memory. Use Share link or Download to keep it." : undefined}
            >
              {saveState === "saving" ? (
                "Saving…"
              ) : saveState === "error" ? (
                <><i className="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> Not saved</>
              ) : (
                <><i className="fa-solid fa-check" aria-hidden="true"></i> Saved</>
              )}
            </span>
          )}
          <div className="glp-pages">
            <button className="glp-smallbtn glp-pages__btn" type="button" onClick={() => { setPagesOpen((o) => !o); setRenaming(false); }} title="Saved pages" style={{ padding: "8px 13px" }}>
              <span className="glp-pages__label">{sharedView ? "Shared design (unsaved)" : currentName}</span>
              <i className="fa-solid fa-chevron-down" style={{ fontSize: 10 }} aria-hidden="true"></i>
            </button>
            {pagesOpen && (
              <>
                <div className="glp-pages__backdrop" onClick={() => { setPagesOpen(false); setRenaming(false); }} />

                    {designs.slice().sort((a, b) => b.updatedAt - a.updatedAt).map((d) => (
                      <button key={d.id} type="button" className={"glp-pages__item" + (d.id === currentId && !sharedView ? " on" : "")} onClick={() => switchTo(d.id)}>
                        <span className="glp-pages__check">{d.id === currentId && !sharedView ? <i className="fa-solid fa-check" aria-hidden="true"></i> : ""}</span>
                        <span className="glp-pages__name">{d.name}</span>
                        <span className="glp-pages__time">{relTime(d.updatedAt)}</span>
                      </button>
                    ))}
                    {!designs.length && <div className="glp-pages__empty">No saved pages yet</div>}
                  </div>
                  {renaming ? (
                    <div className="glp-pages__rename">
                      <input
                        className="glp-input"
                        autoFocus
                        defaultValue={currentName}
                        onKeyDown={(e) => {
                          if (e.key === "Enter") { renameHandled.current = true; renameCurrent(e.target.value); }
                          if (e.key === "Escape") { renameHandled.current = true; setRenaming(false); }
                        }}
                        onBlur={(e) => {
                          /* clicking away (e.g. the backdrop) used to silently discard the typed
                             name — commit it instead, matching every other field in the app */
                          if (renameHandled.current) { renameHandled.current = false; return; }
                          renameCurrent(e.target.value);
                        }}
                      />
                      <button className="glp-smallbtn" type="button" onClick={(e) => renameCurrent(e.currentTarget.previousElementSibling.value)}>
                        Save

                    </div>

                    <>
                    <div className="glp-pages__actions">
                      <button className="glp-smallbtn" type="button" onClick={() => newPage()}>+ New</button>
                      <button className="glp-smallbtn" type="button" disabled={sharedView || !currentId} onClick={() => setRenaming(true)}>Rename</button>
                      <button className="glp-smallbtn" type="button" onClick={duplicateCurrent}>Duplicate</button>
                      <button className="glp-smallbtn glp-smallbtn--danger" type="button" disabled={sharedView || !currentId} onClick={deleteCurrent}>Delete</button>
                    </div>
                    <div className="glp-pages__tpl">
                      <div className="glp-pages__tplhead">New from template</div>
                      {PAGE_TEMPLATES.map((t) => (
                        <button key={t.key} className="glp-pages__item" type="button" onClick={() => newPage(t)}>
                          <i className="fa-solid fa-file-lines" aria-hidden="true"></i>
                          <span>
                            <b>{t.label}</b>
                            <small>{t.hint}</small>
                          </span>
                        </button>

                    </div>
                    <div className="glp-pages__tpl">
                      <button className="glp-pages__item" type="button" onClick={() => { setImportOpen(true); setPagesOpen(false); }}>
                        <i className="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
                        <span><b>Import with Claude</b><small>Bring any docs landing page in as an editable design.</small></span>

                    </div>
                    <div className="glp-pages__tpl">
                      <div className="glp-pages__tplhead">Backup on this computer</div>
                      {fileState === "on" && (

                      {fileState === "reconnect" && (
                        <button className="glp-pages__item" type="button" onClick={reconnectFile}>
                          <i className="fa-solid fa-plug-circle-exclamation" aria-hidden="true" style={{ color: "var(--warn)" }}></i>
