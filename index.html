const FONT_FALLBACK = {
  serif: 'Georgia, "Times New Roman", serif',
  sans: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
  mono: "ui-monospace, SFMono-Regular, Menlo, monospace",
};
const fontStack = (name) => (FONT_FAMILIES[name] ? `'${name}', ${FONT_FALLBACK[FONT_FAMILIES[name].kind]}` : "var(--font-family, inherit)");
/* the page's small labels/buttons use a mono; pick the family's own sibling when it has one */
const MONO_SIBLING = { "Geist": "Geist Mono", "IBM Plex Sans": "IBM Plex Mono", "IBM Plex Serif": "IBM Plex Mono", "DM Sans": "DM Mono", "Space Grotesk": "Space Mono" };
function resolveFonts(cfg) {
  const t0 = cfg.typeface || { heading: "readme", body: "readme" };
  const t = t0.custom === false ? { heading: "readme", body: "readme" } : t0;
  const heading = FONT_FAMILIES[t.heading] ? t.heading : "readme";
  const body = FONT_FAMILIES[t.body] ? t.body : "readme";
  let mono = FONT_FAMILIES[t.mono] && FONT_FAMILIES[t.mono].kind === "mono" ? t.mono : null;
  if (!mono) {
    const pick = [heading, body].find((n) => FONT_FAMILIES[n] && FONT_FAMILIES[n].kind === "mono") || MONO_SIBLING[heading] || MONO_SIBLING[body];
    mono = pick || null;
  }
  const families = [...new Set([heading, body, mono].filter((n) => FONT_FAMILIES[n]))];
  return {
    label: heading === "readme" && body === "readme" ? "Match ReadMe" : `${heading === "readme" ? "ReadMe" : heading} headings, ${body === "readme" ? "ReadMe" : body} body`,
    display: fontStack(heading),
    body: fontStack(body),
    mono: mono ? fontStack(mono) : FONT_FALLBACK.mono,
    importUrl: families.length
      ? "https://fonts.googleapis.com/css2?" + families.map((n) => `family=${n.replace(/ /g, "+")}:wght@${FONT_FAMILIES[n].w}`).join("&") + "&display=swap"
      : null,
  };
}

   cta     : CTA button/link shown
   ctaPlain: CTA is a plain text link
   mono    : mono, uppercase titles (terminal aesthetic)

/* ---------------- helpers ---------------- */
const esc = (s = "") =>
  String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");

/* escape a value for interpolation inside a double-quoted CSS string (e.g. url("...")) —
   an unescaped quote or newline in a user-supplied URL would otherwise break out of the
   string and corrupt the rest of the generated <style> block */
const escCssStr = (s = "") =>
  String(s)
    .replace(/\\/g, "\\\\")
    .replace(/"/g, '\\"')
    .replace(/</g, "\\3c ")
    .replace(/[\r\n]/g, "");

const cardAccent = (card) =>
  card.accent === "custom"
    ? { light: card.customLight, dark: card.customDark }
    : { light: (ACCENTS[card.accent] || ACCENTS.green).light, dark: (ACCENTS[card.accent] || ACCENTS.green).dark };

/* emits one dark-mode rule block for BOTH of ReadMe's dark-mode signals — explicit
   [data-color-mode="dark"] and "follow system" ([data-color-mode="system"] inside
   prefers-color-scheme:dark) — from a single template, so a future edit to one path
   can't silently drift from the other. `body(pad)` returns the CSS declarations,
   already using `pad` as their leading indent. */
const darkBlock = (selector, indent, body) => `
${indent}[data-color-mode="dark"] ${selector} {
${body(indent + "  ")}
${indent}}
${indent}@media (prefers-color-scheme: dark) {
${indent}  [data-color-mode="system"] ${selector} {
${body(indent + "    ")}
${indent}  }
${indent}}`;

/* escape, then turn *word* into <em>word</em> (link-list labels) */
const inlineEm = (s = "") => esc(s).replace(/\*([^*]+)\*/g, "<em>$1</em>");

/* the search placement that actually renders: the brand bar hides ReadMe's
   header, so "native"/"header" would leave search invisible → fall back to hero */
const effSearchMode = (cfg) =>
  cfg.brandBar && cfg.brandBar.enabled
    ? cfg.searchMode === "brand" || cfg.searchMode === "hero" ? cfg.searchMode : "hero"
    : cfg.searchMode === "brand" ? "native" : cfg.searchMode;

const CHEVRON_SVG =
  '<svg class="bnk-chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>';

/* auto-prepend "/" to link paths (leaves full URLs and #anchors alone) */
/* applied when generating (not while typing, which would mangle a half-typed "https://") */
const normPath = (v) =>
  !v ? v : /^\s*(javascript|data|vbscript):/i.test(v) ? "#" : /^([a-z][a-z0-9+.-]*:|[/#?])/i.test(v) ? v : "/" + v;

/* move the item with `id` in `arr` to sit at `toIndex` — the ↑/↓ buttons remain the
   accessible/keyboard baseline; this backs drag-and-drop reordering to any position */
function reorderById(arr, id, toIndex) {
  const from = arr.findIndex((x) => x.id === id);
  if (from < 0) return arr;
  const clamped = Math.max(0, Math.min(toIndex, arr.length - 1));
  if (from === clamped) return arr;
  const copy = arr.slice();
  const [item] = copy.splice(from, 1);
  copy.splice(clamped, 0, item);
  return copy;
}

/* shared native-HTML5-drag reordering for a list of id-keyed rows. The drag SOURCE
   (draggable + dragstart/dragend) belongs only on a small handle, so grabbing
   anywhere else in the row still just toggles it open/closed — but the DROP TARGET
   (dragenter/dragover/drop) belongs on the whole row, so dropping anywhere on a row
   works, not just its handle. Returns both prop-spreads plus the index currently
   being dragged over (for a drop-target highlight). */
function useDragReorder(onReorderToIndex) {
  const draggingId = useRef(null);
  const [overIndex, setOverIndex] = useState(null);
  const dragHandleProps = (id) => ({
    draggable: true,
    onDragStart: (e) => {
      draggingId.current = id;
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", id); } catch (err) {}
      const row = e.currentTarget.closest(".glp-card");
      if (row) e.dataTransfer.setDragImage(row, 12, 12);
    },
    onDragEnd: () => { draggingId.current = null; setOverIndex(null); },
  });
  const dropRowProps = (index) => ({
    onDragEnter: (e) => { if (draggingId.current != null) { e.preventDefault(); setOverIndex(index); } },
    onDragOver: (e) => { if (draggingId.current != null) { e.preventDefault(); e.dataTransfer.dropEffect = "move"; } },
    onDrop: (e) => {
      if (draggingId.current == null) return;
      e.preventDefault();
      const id = draggingId.current;
      draggingId.current = null;
      setOverIndex(null);
      onReorderToIndex(id, index);
    },
  });
  return { dragHandleProps, dropRowProps, overIndex };
}

/* Font Awesome <i> markup (emoji falls back to the raw character) */
const iconMarkup = (o) =>
  o && o.iconType === "fa"
    ? `<i class="fa-${FA_STYLES.includes(o.faStyle) ? o.faStyle : "solid"} fa-${esc(String(o.icon || "").replace(/^fa-/, ""))}" aria-hidden="true"></i>`
    : esc(o ? o.icon : "");

const encodeConfig = (cfg) => btoa(unescape(encodeURIComponent(JSON.stringify(cfg))));
const decodeConfig = (s) => JSON.parse(decodeURIComponent(escape(atob(s))));

/* ---------------- config migration / normalization ---------------- */
/* ---- untrusted-input hardening ----
   Shared links (#c= and /g/) and saved pages are arbitrary JSON, and the preview
   iframe runs same-origin, so every value that reaches generated CSS/markup
   unescaped (colors, numbers, enums) is coerced here. Strings are escaped at
   generation time by esc(). */
const FA_STYLES = ["solid", "regular", "light", "thin", "duotone", "brands"];
const SEARCH_MODES = ["native", "header", "hero", "brand"];
const safeHex = (v, d) => (typeof v === "string" && /^#[0-9a-f]{3,8}$/i.test(v.trim()) ? v.trim() : d);
const safeNum = (v, d, min, max) => {
  const n = Number(v);
  return v === null || v === "" || !Number.isFinite(n) ? d : Math.min(max, Math.max(min, n));
};
const str = (v, d = "") => (typeof v === "string" ? v : v == null ? d : String(v));
const safeLinks = (arr) =>
  Array.isArray(arr) ? arr.filter((l) => l && typeof l === "object").map((l) => ({ label: str(l.label), href: str(l.href) })) : [];

const CARD_STR_FIELDS = ["icon", "title", "blurb", "href", "eyebrow", "peekLabel", "ctaText", "note", "noteLinkLabel", "noteHref"];
const normCard = (c) => {
  const o = { ...CARD_DEFAULTS, ...(c && typeof c === "object" ? c : {}) };
  CARD_STR_FIELDS.forEach((k) => { o[k] = str(o[k], CARD_DEFAULTS[k]); });
  return {
    ...o,
    faStyle: FA_STYLES.includes(o.faStyle) ? o.faStyle : "solid",
    customLight: safeHex(o.customLight, CARD_DEFAULTS.customLight),
    customDark: safeHex(o.customDark, CARD_DEFAULTS.customDark),
    peekItems: Array.isArray(o.peekItems) ? o.peekItems.map((x) => str(x)) : [],
    links: safeLinks(o.links),
    id: o.id || uid(),
  };
};

/* clamp every numeric / enum / color value the generator interpolates raw */
function sanitizeConfig(c) {
  const h = c.hero;
  const hero = { ...h };
  ["eyebrow", "chip", "chipHref", "title", "subtitle", "searchHint"].forEach((k) => { hero[k] = str(h[k]); });
  hero.titleSize = h.titleSize == null ? null : safeNum(h.titleSize, null, 16, 96);
  hero.subtitleSize = h.subtitleSize == null ? null : safeNum(h.subtitleSize, null, 10, 32);
  hero.padY = safeNum(h.padY, 0, 0, 240);
  hero.btnPrimary = { label: str(h.btnPrimary && h.btnPrimary.label), href: str(h.btnPrimary && h.btnPrimary.href) };
  hero.btnSecondary = { label: str(h.btnSecondary && h.btnSecondary.label), href: str(h.btnSecondary && h.btnSecondary.href) };
  const bb = c.brandBar;
  const okFont = (n) => (n === "readme" || FONT_FAMILIES[n] ? n : "readme");
  return {
    ...c,
    typeface: { custom: !!c.typeface.custom, heading: okFont(c.typeface.heading), body: okFont(c.typeface.body), ...(FONT_FAMILIES[c.typeface.mono] ? { mono: c.typeface.mono } : {}) },
    hero,
    footer: str(c.footer),
    searchMode: SEARCH_MODES.includes(c.searchMode) ? c.searchMode : "native",
    headerImage: {
      ...c.headerImage,
      url: str(c.headerImage.url),
      height: safeNum(c.headerImage.height, 380, 80, 1200),
      tint: safeNum(c.headerImage.tint, 0, 0, 100),
      offset: safeNum(c.headerImage.offset, 64, 0, 400),
    },
    theme: {
      colorMode: c.theme.colorMode === "custom" ? "custom" : "readme",
      pattern: !!c.theme.pattern,
      colors: {
        light: Object.fromEntries(COLOR_ROLES.map((r) => [r.key, safeHex(c.theme.colors.light[r.key], "")])),
        dark: Object.fromEntries(COLOR_ROLES.map((r) => [r.key, safeHex(c.theme.colors.dark[r.key], "")])),
      },
    },
    cardStyle: { ...c.cardStyle, radius: safeNum(c.cardStyle.radius, 16, 0, 48) },
    layout: { maxW: safeNum(c.layout.maxW, 1120, 640, 1920) },
    brandBar: { ...bb, name: str(bb.name), tag: str(bb.tag), logoUrl: str(bb.logoUrl), links: safeLinks(bb.links),
      button: { enabled: !!bb.button.enabled, label: str(bb.button.label), href: str(bb.button.href) } },
    sections: c.sections.map((sec) => ({
      ...sec,
      heading: str(sec.heading),
      intro: str(sec.intro),
      label: str(sec.label),
      style: { ...sec.style, radius: safeNum(sec.style.radius, 16, 0, 48) },
      layout: {
        ...sec.layout,
        colMin: safeNum(sec.layout.colMin, 258, 120, 800),
        gap: safeNum(sec.layout.gap, 20, 0, 120),
        cardMinH: safeNum(sec.layout.cardMinH, 396, 0, 1600),
        spaceAbove: safeNum(sec.layout.spaceAbove, 36, 0, 400),
      },
      liquid: {
        ...sec.liquid,
        faStyle: FA_STYLES.includes(sec.liquid.faStyle) ? sec.liquid.faStyle : "solid",
        peekCount: safeNum(sec.liquid.peekCount, 3, 1, 10),
        accents: Array.isArray(sec.liquid.accents) && sec.liquid.accents.length ? sec.liquid.accents.map((a) => str(a)) : ["green"],
      },
      columns: sec.columns.map((col) => ({ ...col, heading: str(col.heading), body: str(col.body), ctas: col.ctas.map((ct) => ({ ...ct, label: str(ct.label), href: str(ct.href) })) })),
    })),
  };
}

const normColumn = (c) => makeColumn({ ...c, id: c && c.id });
const normSection = (s) => ({
  id: s.id || uid(),
  type: s.type === "columns" ? "columns" : "cards",
  /* builder-only label for the sidebar/tab — independent of the on-page heading */
  label: s.label || "",
  heading: s.heading || "",
  intro: s.intro || "",
  align: s.align === "left" ? "left" : "center",
  source: s.source === "liquid" ? "liquid" : "static",
  /* older saved sections keep their own look ("custom"); the global style is
     opt-in per section so migrating never changes an existing page's cards */
  styleMode: s.styleMode === "global" ? "global" : "custom",
  style: { ...DEFAULT_STYLE, ...(s.style || {}), num: false, file: false },
  layout: { ...DEFAULT_SECTION_LAYOUT, ...(s.layout || {}) },
  liquid: { ...DEFAULT_LIQUID, ...(s.liquid || {}) },
  columns: (Array.isArray(s.columns) && s.columns.length ? s.columns.slice(0, 4) : DEFAULT_COLUMNS()).map(normColumn),
  cards: (Array.isArray(s.cards) && s.cards.length ? s.cards : DEFAULT_CONFIG.sections[0].cards).map(normCard),
});

/* Reassign any duplicate section/card ids (legacy data saved before ids were
   collision-proof) so React keys stay unique — otherwise deleting/editing one
   section hits its duplicate too. */
function dedupeIds(sections) {
  const seen = new Set();
  return sections.map((s) => {
    let id = s.id;
    if (!id || seen.has(id)) id = uid();
    seen.add(id);
    const cards = s.cards.map((c) => {
      let cid = c.id;
      if (!cid || seen.has(cid)) cid = uid();
      seen.add(cid);
      return cid === c.id ? c : { ...c, id: cid };
    });
    return { ...s, id, cards };
  });
}

/* merge a (possibly older/partial) shared config over the defaults */
function migrateConfig(loaded) {
  const D = DEFAULT_CONFIG;
  if (!loaded || typeof loaded !== "object") loaded = {};
  if (Array.isArray(loaded.sections)) loaded = { ...loaded, sections: loaded.sections.filter((x) => x && typeof x === "object") };
  const base = {
    typeface: (() => {
      const t = loaded.typeface;
      if (t && typeof t === "object") return { custom: !!t.custom || t.heading !== "readme" || t.body !== "readme", heading: str(t.heading, "readme"), body: str(t.body, "readme"), ...(t.mono ? { mono: str(t.mono) } : {}) };
      const lp = LEGACY_FONT_PRESETS[loaded.fonts] || LEGACY_FONT_PRESETS.readme;
      return { custom: lp.heading !== "readme", ...lp };
    })(),
    hero: { ...D.hero, ...(loaded.hero || {}) },
    ticker: { ...D.ticker, ...(loaded.ticker || {}) },
    brandBar: {
      ...D.brandBar,
      ...(loaded.brandBar || {}),
      links: loaded.brandBar && Array.isArray(loaded.brandBar.links) ? loaded.brandBar.links : D.brandBar.links,
      button: { ...D.brandBar.button, ...((loaded.brandBar && loaded.brandBar.button) || {}) },
    },
    searchMode: loaded.searchMode || (loaded.moveSearch === false ? "native" : "hero"),
    flattenHeader: loaded.flattenHeader !== false,
    headerImage: { ...D.headerImage, ...(loaded.headerImage || {}) },
    theme: (() => {
      const t = loaded.theme || {};
      const colors = EMPTY_COLORS();
      if (t.colors && typeof t.colors === "object") {
        ["light", "dark"].forEach((m) => COLOR_ROLES.forEach((r) => { colors[m][r.key] = str(t.colors[m] && t.colors[m][r.key]); }));
        return { colorMode: t.colorMode === "custom" ? "custom" : "readme", colors, pattern: !!t.pattern };
      }
      /* older configs: matchReadme / uniform + accent|custom pair */
      if (t.matchReadme === false && t.uniform) {
        const a = t.accent === "custom" ? { light: t.customLight, dark: t.customDark } : ACCENTS[t.accent] || ACCENTS.blue;
        colors.light.brand = str(a.light);
        colors.dark.brand = str(a.dark);
      }
      return { colorMode: t.matchReadme === false ? "custom" : "readme", colors, pattern: !!t.pattern };
    })(),
    cardStyle: { ...DEFAULT_STYLE, ...(loaded.cardStyle || {}), num: false, file: false },
    layout: { maxW: (loaded.layout && loaded.layout.maxW) || 1120 },
    banner: { ...D.banner, ...(loaded.banner || {}) },
    footer: loaded.footer != null ? loaded.footer : D.footer,
  };

  /* already v4 (has sections) */
  if (loaded.sections && loaded.sections.length) {
    return sanitizeConfig({ ...base, sections: dedupeIds(loaded.sections.map(normSection)) });
  }

  /* migrate v3 (single template + flat cards) into one section */
  const grid = loaded.layout || {};
  const section = normSection({
    heading: (loaded.section && loaded.section.title) || "",
    intro: (loaded.section && loaded.section.text) || "",
    align: loaded.hero && loaded.hero.align === "left" ? "left" : "center",
    source: loaded.liquid && loaded.liquid.enabled ? "liquid" : "static",
    style: TEMPLATE_TO_STYLE[loaded.template] || DEFAULT_STYLE,
    layout: {
      colMin: grid.colMin || 258,
      gap: grid.gap || 20,
      autoH: !!grid.autoH,
      cardMinH: grid.cardMinH || 396,
      bento: loaded.template === "bento",
    },
    liquid: loaded.liquid || {},
    cards: loaded.cards || [],
  });
  return sanitizeConfig({ ...base, sections: [section] });
}

/* ============================================================
   NAMED DESIGNS — localStorage-backed "my pages" + autosave
   Each design: { id, name, config, override, updatedAt }
   ============================================================ */
const DESIGNS_KEY = "glp-builder:designs";
const CURRENT_KEY = "glp-builder:currentId";
const nowMs = () => Date.now();

const relTime = (t) => {
  const s = Math.max(0, Math.floor((Date.now() - t) / 1000));
  if (s < 45) return "just now";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24) return h + "h ago";
  return Math.floor(h / 24) + "d ago";
};

const makeDesign = (name, config, override) => ({ id: uid(), name, config, override: override || "", updatedAt: nowMs() });

/* ============================================================
   FILE BACKUP — designs mirrored to a real JSON file on disk
   localStorage is wiped by "clear browsing data", so the Pages menu can also
   keep a file (File System Access API, Chrome/Edge) in sync on every save.
   The file handle lives in IndexedDB; after a reload Chrome needs one click to
   re-grant access, and after a full cache clear you just re-open the file.
   Export/Import JSON works in every browser as the manual fallback.
   ============================================================ */
const FILE_FORMAT = "glp-builder-designs";
const fsSupported = () => typeof window !== "undefined" && "showSaveFilePicker" in window && "showOpenFilePicker" in window;

function idb(op, value) {
  return new Promise((resolve) => {
    try {
      const req = indexedDB.open("glp-builder", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("kv");
      req.onerror = () => resolve(null);
      req.onsuccess = () => {
        const db = req.result;
        const tx = db.transaction("kv", op === "get" ? "readonly" : "readwrite");
        const store = tx.objectStore("kv");
        const r = op === "get" ? store.get("fileHandle") : op === "set" ? store.put(value, "fileHandle") : store.delete("fileHandle");
        r.onsuccess = () => resolve(op === "get" ? r.result || null : true);
        r.onerror = () => resolve(null);
      };
    } catch (e) { resolve(null); }
  });
}

const designsFileJson = (ds) => JSON.stringify({ format: FILE_FORMAT, version: 1, savedAt: new Date().toISOString(), designs: ds }, null, 2);

/* accepts our file format (or a bare array); returns valid designs only */
function parseDesignsFile(text) {
  const data = JSON.parse(text);
  const list = Array.isArray(data) ? data : data && Array.isArray(data.designs) ? data.designs : null;
  if (!list) throw new Error("That file doesn't contain GLP Builder designs.");
  return list
    .filter((d) => d && typeof d === "object" && d.config && typeof d.config === "object")
    .map((d) => ({ id: typeof d.id === "string" ? d.id : uid(), name: str(d.name, "Imported page"), config: d.config, override: str(d.override), updatedAt: Number(d.updatedAt) || nowMs() }));
}

/* union by id; the newer copy of a page wins */
function mergeDesigns(a, b) {
  const map = new Map(a.map((d) => [d.id, d]));
  b.forEach((d) => { const cur = map.get(d.id); if (!cur || d.updatedAt > cur.updatedAt) map.set(d.id, d); });
  return [...map.values()];
}

async function writeHandle(handle, ds) {
  const w = await handle.createWritable();
  await w.write(designsFileJson(ds));
  await w.close();
}

function persistDesigns(ds, curId) {
  try {
    localStorage.setItem(DESIGNS_KEY, JSON.stringify(ds));
    if (curId) localStorage.setItem(CURRENT_KEY, curId);
    return true;
  } catch (e) {
    /* storage unavailable/full (quota, private mode, sandbox) — caller reflects this in the UI
       instead of claiming "Saved" over work that only exists in memory */
    return false;
  }
}

/* choose the initial working state: shared link → last-open page → a fresh page */
function loadInitialState() {
  let designs = [];
  try {
    const raw = localStorage.getItem(DESIGNS_KEY);
    if (raw) designs = JSON.parse(raw);
  } catch (e) {}
  if (!Array.isArray(designs)) designs = [];

  /* a short-link path (/g/<code>) opens a stored shared design, fetched
     asynchronously after boot — mark it pending and show the default meanwhile */
  try {
    const pm = window.location.pathname.match(/\/g\/([a-z0-9]{4,16})/i);
    if (pm) return { config: DEFAULT_CONFIG, override: null, designs, currentId: null, sharedView: true, pendingShare: pm[1].toLowerCase() };
  } catch (e) {}

  /* a shared #c= link carries the whole config inline (older links) */
  try {
    const m = window.location.hash.match(/#c=([A-Za-z0-9+/=]+)/);
    if (m) return { config: migrateConfig(decodeConfig(m[1])), override: null, designs, currentId: null, sharedView: true };
  } catch (e) {}

  let curId = null;
  try { curId = localStorage.getItem(CURRENT_KEY); } catch (e) {}
  const cur = designs.find((d) => d.id === curId) || designs[0];
  if (cur) return { config: migrateConfig(cur.config), override: cur.override || null, designs, currentId: cur.id, sharedView: false };

  const d = makeDesign("Untitled page", DEFAULT_CONFIG, "");
  return { config: DEFAULT_CONFIG, override: null, designs: [d], currentId: d.id, sharedView: false };
}

/* ============================================================
   HTML GENERATOR
   ============================================================ */
const INLINE_CARD_STYLE =
  'style="background-color: var(--card-bg-now, var(--card-bg)) !important; background: var(--card-bg-now, var(--card-bg)) !important; border: 1px solid var(--card-border-now, var(--card-border)) !important; border-radius: var(--card-radius) !important; box-shadow: var(--card-shadow) !important; backdrop-filter: var(--card-blur) !important; -webkit-backdrop-filter: var(--card-blur) !important;"';

/* card markup builder — used for both static cards and the Liquid loop
   (vars are either literal strings or Liquid tags) */
function buildCard(v, style) {
  const primaryCls = v.primary ? " bnk-card--primary" : "";
  /* a card holding its own links can't also be one big <a> (nested anchors) */
  const anchor = style.anchor && !(style.links && v.linksHtml);
  style = anchor === style.anchor ? style : { ...style, anchor };
  const extra = v.attrs || "";
  const openTag = style.anchor
    ? `<a class="bnk-card ${v.accentClass}${primaryCls}" href="${v.href}"${extra}\n       ${INLINE_CARD_STYLE}>`
    : `<div class="bnk-card ${v.accentClass}${primaryCls}"${extra}\n       ${INLINE_CARD_STYLE}>`;
  const closeTag = style.anchor ? "</a>" : "</div>";

  /* content lives in a growing body so cards stay equal height and the CTA
     keeps a consistent gap / bottom-aligns regardless of content length */
  let body = "";
  if (style.badge) body += `\n        <span class="bnk-card__eyebrow">${v.badgeHtml}${v.eyebrow}</span>`;
  const iconHtml = `<span class="bnk-card__icon" aria-hidden="true">${v.icon}</span>`;
  const edf = v.ed || (() => "");
  const titleHtml = `<span class="bnk-card__title"${edf("title")}>${v.title}</span>`;
  if (style.icon && style.iconInline) body += `\n        <span class="bnk-card__head">${iconHtml}${titleHtml}</span>`;
  else {
    if (style.icon) body += `\n        ${iconHtml}`;
    body += `\n        ${titleHtml}`;
  }
  if (v.blurb) body += `\n        <span class="bnk-card__blurb"${edf("blurb")}>${v.blurb}</span>`;
  if (style.links && v.linksHtml) body += `\n${v.linksHtml}`;
  if (style.peek && v.peekHtml) body += `\n${v.peekHtml}`;

  let foot = "";
  if (style.cta) {
    const ctaCls = style.ctaPlain
      ? "bnk-card__go bnk-card__go--plain"
      : `bnk-card__go bnk-card__go--${v.ctaStyle === "filled" ? "filled" : "ghost"}`;
    foot = style.anchor
      ? `\n      <span class="${ctaCls}">${v.ctaText}<span class="rm-arrow" aria-hidden="true">&#8594;</span></span>`
      : `\n      <a class="${ctaCls}" href="${v.href}">${v.ctaText}<span class="rm-arrow" aria-hidden="true">&#8594;</span></a>`;
  } else if (style.anchor) {
    /* whole-card link with no CTA → trailing arrow (compact "tiles" feel) */
    foot = `\n      <span class="rm-arrow bnk-card__arrow" aria-hidden="true">&#8594;</span>`;
  }

  const inner = `\n      <span class="bnk-card__body">${body}\n      </span>${foot}`;

  return `    <!-- ${v.comment} -->\n    ${openTag}${inner}\n    ${closeTag}`;
}

/* In-preview text editing: when generating for the Build-tab preview, editable
   text nodes carry data-glp="<config path>". The preview shim makes them
   contenteditable and posts edits back (see PREVIEW_EDIT_SCRIPT). Exported
   HTML never contains these attributes. */
let _editable = false;
const ed = (path) => (_editable ? ` data-glp="${path}"` : "");
/* config paths the preview may write — anything else posted back is ignored */
const EDITABLE_PATH_RE =
  /^(hero\.(eyebrow|title|subtitle|searchHint|btnPrimary\.label|btnSecondary\.label)|footer|banner\.(title|text)|brandBar\.(links\.\d+\.label|button\.label)|sections\.\d+\.(heading|intro|cards\.\d+\.(title|blurb|peekLabel|peekItems\.\d+|links\.\d+\.label)|columns\.\d+\.(heading|body)))$/;

/* immutable set of a dotted path ("sections.0.cards.2.title") */
function setAtPath(obj, parts, value) {
  const [k, ...rest] = parts;
  const key = Array.isArray(obj) ? Number(k) : k;
  const next = Array.isArray(obj) ? obj.slice() : { ...obj };
  next[key] = rest.length ? setAtPath(obj[key], rest, value) : value;
  return next;
}

function staticPeek(c, base) {
  const items = c.peekItems.map((p, j) => [p, j]).filter(([p]) => p.trim());
  if (!items.length) return "";
  return `      <span class="bnk-card__peek">
        <span class="bnk-card__peek-label"${ed(base + ".peekLabel")}>${esc(c.peekLabel)}</span>
${items
  .map(([p, j]) => `        <span class="bnk-card__peek-item">${c.peekArrows ? '<span class="bnk-tick">&#8594;</span>' : ""}<span${ed(base + ".peekItems." + j)}>${esc(p)}</span></span>`)
  .join("\n")}
      </span>`;
}

function staticLinks(c, base) {
  const links = (c.links || []).map((l, j) => [l, j]).filter(([l]) => (l.label || "").trim());
  const rows = links
    .map(([l, j]) => `          <a class="bnk-card__link" href="${esc(normPath(l.href || "/"))}">${CHEVRON_SVG}<span${ed(base + ".links." + j + ".label")}>${inlineEm(l.label)}</span></a>`)
    .join("\n");
  const noteText = (c.note || "").trim();
  const noteLink = (c.noteLinkLabel || "").trim();
  const note =
    noteText || noteLink
      ? `        <span class="bnk-card__note">${esc(noteText)}${
          noteLink ? `${noteText ? " " : ""}<a href="${esc(normPath(c.noteHref || "/"))}">${esc(noteLink)}</a>` : ""
        }</span>`
      : "";
  if (!rows && !note) return "";
  return `${rows ? `        <span class="bnk-card__links">\n${rows}\n        </span>` : ""}${rows && note ? "\n" : ""}${note}`;
}

/* build the cards for one section — static list or a Liquid loop.
   `style` is the section's effective card style (its own or the global one). */
function sectionCards(sec, palette, style, si) {
  const N = Math.max(1, palette.length);
  if (sec.source !== "liquid") {
    return sec.cards
      .map((c, i) =>
        buildCard(
          {
            accentClass: `bnk-card--a${i}`,
            primary: c.primary,
            href: esc(normPath(c.href)),
            eyebrow: esc(c.eyebrow),
            badgeHtml: c.badge === "lock" ? LOCK_SVG : '<span class="bnk-dot"></span>',
            icon: iconMarkup(c),
            title: esc(c.title),
            blurb: esc(c.blurb),
            linksHtml: staticLinks(c, `sections.${si}.cards.${i}`),
            peekHtml: staticPeek(c, `sections.${si}.cards.${i}`),
            ed: (f) => ed(`sections.${si}.cards.${i}.${f}`),
            ctaText: esc(c.ctaText),
            ctaStyle: c.ctaStyle,
            comment: `Card ${i + 1}: ${esc(c.title)}`,
          },
          style
        )
      )
      .join("\n\n");
  }

  const Q = sec.liquid;
  const liquidPeek = Q.peek
    ? `      <span class="bnk-card__peek">
        <span class="bnk-card__peek-label">${esc(Q.peekLabel)}</span>
        {% for category in child.guides limit: ${Q.peekCount} %}
        <span class="bnk-card__peek-item">{{ category.title }}</span>
        {% endfor %}
      </span>`
    : "";
  const inner = buildCard(
    {
      accentClass: "bnk-card--a{{ ai }}",
      primary: false,
      href: "/{{ child.subdomain }}",
      eyebrow: esc(Q.eyebrow),
      badgeHtml: Q.badge === "lock" ? LOCK_SVG : '<span class="bnk-dot"></span>',
      icon: iconMarkup(Q),
      title: "{{ child.name }}",
      blurb: `{{ child.description | default: "${esc(Q.blurbFallback)}" }}`,
      peekHtml: liquidPeek,
      ctaText: esc(Q.ctaText),
      ctaStyle: Q.ctaStyle,
      comment: "One card per child project (Liquid)",
      /* preview only: these cards are filled by ReadMe, so the preview explains
         that on hover and opens the section's settings on click */
      attrs: _editable ? ` data-glp-auto="${si}"` : "",
    },
    style
  );
  return `    {% for child in parentProject.childrenProjects %}
    {% assign ai = forloop.index0 | modulo: ${N} %}
${inner}
    {% endfor %}`;
}

/* build a text-columns section (1–4 evenly-distributed columns) */
function sectionColumns(sec, si) {
  const cols = (sec.columns || []).slice(0, 4);
  return cols
    .map((col, i) => {
      const parts = [];
      if ((col.heading || "").trim()) parts.push(`      <h3 class="bnk-col__title"${ed(`sections.${si}.columns.${i}.heading`)}>${esc(col.heading)}</h3>`);
      if ((col.body || "").trim()) parts.push(`      <p class="bnk-col__text"${ed(`sections.${si}.columns.${i}.body`)}>${esc(col.body)}</p>`);
      const ctas = (col.ctas || []).filter((c) => (c.label || "").trim());
      if (ctas.length) {
        const links = ctas
          .map((cta) => {
            const cls =
              cta.style === "filled"
                ? "bnk-col__cta bnk-col__cta--filled"
                : cta.style === "button"
                ? "bnk-col__cta bnk-col__cta--btn"
                : "bnk-col__cta";
            return `        <a class="${cls}" href="${esc(normPath(cta.href || "/"))}">${esc(cta.label)}<span class="rm-arrow" aria-hidden="true">&#8594;</span></a>`;
          })
          .join("\n");
        parts.push(`      <div class="bnk-col__ctas">\n${links}\n      </div>`);
      }
      return `    <!-- Column ${i + 1} -->\n    <div class="bnk-col">\n${parts.join("\n")}\n    </div>`;
    })
    .join("\n\n");
}

const densityPad = (d) => (d === "compact" ? "19px 20px 18px" : d === "comfortable" ? "26px 26px 24px" : "25px 25px 23px");

/* ============================================================
   NAIVE LIQUID EXPANSION — for the live preview only.
   ReadMe renders the real Liquid server-side; here we substitute
   sample child projects so the preview looks real. Handles any
   number of per-section child-project loops.
   ============================================================ */
const SAMPLE_PROJECTS = [
  { name: "Payments API", subdomain: "payments", desc: "Accept payments, manage refunds, and reconcile settlements." },
  { name: "Identity", subdomain: "identity", desc: "SSO, MFA, and user permission management for your apps." },
  { name: "Client SDKs", subdomain: "sdks", desc: "Official libraries for Node, Python, Go, and React Native." },
];
const SAMPLE_CATEGORIES = ["Getting started", "Authentication", "Webhooks"];

function expandLiquidForPreview(html) {
  if (!html.includes("{%")) return html;
  let out = html;

  /* inner loop: guide categories (global — same sample list for every card) */
  out = out.replace(/\{%-?\s*for category in child\.guides[^%]*%\}([\s\S]*?)\{%-?\s*endfor\s*-?%\}/g, (_, inner) =>
    SAMPLE_CATEGORIES.map((cat) => inner.replace(/\{\{\s*category\.title\s*\}\}/g, cat)).join("")
  );

  /* outer loops: child projects — each loop carries its own `modulo: N` */
  out = out.replace(/\{%-?\s*for child in parentProject\.childrenProjects\s*-?%\}([\s\S]*?)\{%-?\s*endfor\s*-?%\}/g, (_, block) => {
    const nm = block.match(/modulo:\s*(\d+)/);
    const N = nm ? Math.max(1, parseInt(nm[1], 10)) : 3;
    const body = block.replace(/\{%-?\s*assign[^%]*%\}\n?/g, "");
    return SAMPLE_PROJECTS.map((p, i) =>
      body
        .replace(/\{%\s*if forloop\.index < 10\s*%\}0\{%\s*endif\s*%\}/g, "0")
        .replace(/\{\{\s*forloop\.index0\s*\}\}/g, String(i))
        .replace(/\{\{\s*forloop\.index\s*\}\}/g, String(i + 1))
        .replace(/\{\{\s*ai\s*\}\}/g, String(i % N))
        .replace(/\{\{\s*child\.name\s*\}\}/g, p.name)
        .replace(/\{\{\s*child\.subdomain\s*\}\}/g, p.subdomain)
        .replace(/\{\{\s*child\.description[^}]*\}\}/g, p.desc)
    ).join("\n");
  });

  /* parent tokens + anything left over */
  out = out
    .replace(/\{\{\s*parentProject\.name\s*\}\}/g, "Your Group")
    .replace(/\{\{\s*parentProject\.description[^}]*\}\}/g, "All product documentation in one place.");
  return out;
}

/* ============================================================
   PREVIEW SHIM — fakes ReadMe's hub chrome in the iframe
   ============================================================ */
/* runs inside the preview iframe: makes data-glp text editable in place and
   posts { path, value } to the builder when an edit is committed */
const PREVIEW_EDIT_SCRIPT = `
<style>
  [data-glp] { cursor: text; border-radius: 3px; outline: 1px dashed transparent; outline-offset: 3px; transition: outline-color 120ms ease; }
  [data-glp]:hover { outline-color: rgba(33,58,255,.55); }
  [data-glp]:focus { outline: 2px solid #213AFF; outline-offset: 3px; }
  [data-glp-auto] { cursor: help; }
  [data-glp-auto]:hover { outline: 1px dashed rgba(33,58,255,.55); outline-offset: 3px; }
</style>
<script>
(function () {
  function text(el) {
    var c = el.cloneNode(true);
    c.querySelectorAll("em").forEach(function (m) { m.replaceWith("*" + m.textContent + "*"); });
    return c.textContent.replace(/\\s+/g, " ").trim();
  }
  function arm(el) {
    if (el.__glp) return;
    el.__glp = true;
    try { el.contentEditable = "plaintext-only"; } catch (e) {}
    if (el.contentEditable !== "plaintext-only") el.contentEditable = "true";
    el.spellcheck = false;
    el.addEventListener("focus", function () { el.__orig = text(el); el.__origHtml = el.innerHTML; });
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); el.blur(); }
      if (e.key === "Escape") { el.__cancel = true; el.blur(); }
      e.stopPropagation();
    });
    el.addEventListener("blur", function () {
      if (el.__cancel) { el.__cancel = false; el.innerHTML = el.__origHtml; return; }
      var v = text(el);
      if (v !== el.__orig) parent.postMessage({ type: "glp-edit", path: el.getAttribute("data-glp"), value: v }, "*");
    });
  }
  function armAll() {
    document.querySelectorAll("[data-glp]").forEach(arm);
    /* stop link drag-ghosts from hijacking clicks on text inside cards/links */
    document.querySelectorAll("a").forEach(function (a) { a.draggable = false; });
  }
  /* Chrome won't put a caret in editable text nested inside a link (whole-card
     links, link-list rows): the click is treated as a link click. So for those,
     focus the text ourselves and drop the caret exactly where the user clicked. */
  function inLink(el) { return el.parentElement && el.parentElement.closest("a"); }
  document.addEventListener("mousedown", function (e) {
    var el = e.target.closest && e.target.closest("[data-glp]");
    if (!el || e.button !== 0 || !inLink(el)) return;
    e.preventDefault();
    el.focus({ preventScroll: true });
    var r = document.caretRangeFromPoint && document.caretRangeFromPoint(e.clientX, e.clientY);
    if (r && el.contains(r.startContainer)) { var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  }, true);
  /* double-click still selects a word in those spots */
  document.addEventListener("dblclick", function (e) {
    var el = e.target.closest && e.target.closest("[data-glp]");
    if (!el || !inLink(el)) return;
    var s = getSelection();
    if (s.modify) { s.modify("move", "backward", "word"); s.modify("extend", "forward", "word"); }
  }, true);
  /* "Auto from projects" cards: nothing to type into, so say why and let a
     click jump to that section's settings in the builder */
  var tip = null;
  function showTip(card, x, y) {
    if (!tip) {
      tip = document.createElement("div");
      tip.setAttribute("style", "position:fixed;z-index:99999;max-width:260px;padding:8px 11px;border-radius:8px;background:#00033F;color:#fff;font:500 12px/1.45 -apple-system,Segoe UI,sans-serif;box-shadow:0 8px 24px rgba(0,3,63,.3);pointer-events:none");
      tip.innerHTML = "<b>Auto-filled by ReadMe</b><br>One card per child project, using each project's name and description. Click to open this section's settings.";
      document.body.appendChild(tip);
    }
    tip.style.display = "block";
    var w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(x + 14, innerWidth - w - 8) + "px";
    tip.style.top = Math.min(y + 16, innerHeight - h - 8) + "px";
  }
  document.addEventListener("mousemove", function (e) {
    var card = e.target.closest && e.target.closest("[data-glp-auto]");
    if (card) showTip(card, e.clientX, e.clientY); else if (tip) tip.style.display = "none";
  });
  document.addEventListener("click", function (e) {
    var card = e.target.closest && e.target.closest("[data-glp-auto]");
    if (card) parent.postMessage({ type: "glp-focus-section", index: Number(card.getAttribute("data-glp-auto")) }, "*");
  }, true);

  /* links inside the preview never navigate */
  document.addEventListener("click", function (e) { if (e.target.closest && e.target.closest("a")) e.preventDefault(); }, true);
  document.addEventListener("auxclick", function (e) { if (e.target.closest && e.target.closest("a")) e.preventDefault(); }, true);
  armAll();
  document.addEventListener("DOMContentLoaded", armAll);
})();
<\/script>`;

  .glp-uimenu__check { margin-left: auto; color: var(--accent); font-size: 11px; }
  .glp-copy {
    display: inline-flex; align-items: center; gap: 8px;
    border: 0; cursor: pointer;
    background: var(--accent-fill); color: var(--accent-ink);
    font-family: inherit; font-size: 14px; font-weight: 500;
    padding: 8px 18px; border-radius: 999px;
    transition: background 150ms cubic-bezier(.25,1,.5,1);
  }
  .glp-copy:hover { background: var(--accent-hover); }
  .glp-copy.done { background: var(--ok); color: var(--accent-ink); }

  .glp-main { flex: 1; display: flex; min-height: 0; }

  .glp-navtabs {
    position: sticky; top: -20px; z-index: 6;
    margin: -20px -20px 16px; padding: 8px 10px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .glp-navtabs button {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    border: 0; border-radius: 8px; background: transparent; cursor: pointer; font-family: inherit;
    padding: 7px 4px 6px; color: var(--ink-3); font-size: 11.5px; font-weight: 600; white-space: nowrap;
  }
  /* each area has its own hue (--tc): colored icon at rest, tinted pill when active */
  .glp-navtabs [data-tab="theme"] { --tc: var(--hue-theme); }
  .glp-navtabs [data-tab="headerFooter"] { --tc: var(--hue-header); }
  .glp-navtabs [data-tab="hero"] { --tc: var(--hue-hero); }
  .glp-navtabs [data-tab="sections"] { --tc: var(--hue-sections); }
  .glp-navtabs button { color: var(--ink-2); font-size: 12.5px; font-weight: 500; border-radius: 10px; }
  .glp-navtabs button i { font-size: 15px; color: var(--tc); transition: transform 180ms cubic-bezier(.25,1,.5,1); }
  .glp-navtabs button:hover { color: var(--ink); background: color-mix(in oklch, var(--tc) 8%, var(--panel)); }
  .glp-navtabs button.on {
    color: var(--ink); background: color-mix(in oklch, var(--tc) 13%, var(--panel));
    box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--tc) 40%, transparent);
  }
  .glp-side {
    width: 452px; flex: none;
    border-right: 1px solid var(--line);
    background: var(--panel);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 20px 20px 64px;
  }
  .glp-side::-webkit-scrollbar { width: 10px; }
  .glp-side::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 5px; }

  /* React-controlled accordion (no native <details> — avoids the browser vs
     React open-state divergence that could collapse a panel and strand scroll) */
  .glp-sec { margin-bottom: 26px; }
  .glp-sec:not(.open) { margin-bottom: 14px; }

  .glp-field { margin-bottom: 9px; }
  .glp-field label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
  /* label-left rows: one line instead of two for sliders, numbers and short segmented choices */
  .glp-field--inline { display: grid; grid-template-columns: 104px minmax(0, 1fr); align-items: center; gap: 10px; }
  .glp-field--inline > label { margin: 0; line-height: 1.3; }
  .glp-field--inline .glp-seg { justify-self: start; max-width: 100%; }
  .glp-toggles2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .glp-subtabs { display: flex; gap: 2px; margin: 2px 0 12px; border-bottom: 1px solid var(--line); }
  .glp-subtabs button {
    border: 0; background: transparent; color: var(--ink-3); cursor: pointer; font-family: inherit;
    font-size: 12px; font-weight: 600; padding: 7px 10px 8px; margin-bottom: -1px; border-bottom: 2px solid transparent;
  }
  .glp-subtabs button:hover { color: var(--ink); }
  .glp-subtabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .glp-input, .glp-textarea, .glp-select {
    width: 100%;
    background: var(--field);
    border: 1px solid var(--line-2);
    color: var(--ink);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13.5px;
    line-height: 20px;
    font-family: inherit;
  }
  .glp-input::placeholder, .glp-textarea::placeholder { color: var(--ink-3); }
  .glp-input:focus, .glp-textarea:focus, .glp-select:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus-soft); }
  .glp-textarea { resize: vertical; min-height: 40px; line-height: 1.45; field-sizing: content; max-height: 160px; }

  /* a text field with its own size control folded into the same row, instead of a
     separate row underneath — the pair reads as one input with the number a detail
     inside it, rather than two competing fields */
  .glp-fieldrow {
    display: flex; align-items: flex-start; gap: 6px;
    border: 1px solid var(--line-2); border-radius: 6px; background: var(--field);
  }
  .glp-fieldrow:focus-within { border-color: var(--accent); box-shadow: var(--focus-soft); }
  .glp-fieldrow > .glp-input, .glp-fieldrow > .glp-textarea {
    flex: 1; min-width: 0; border: 0; background: transparent;
  }
  .glp-fieldrow > .glp-input:focus, .glp-fieldrow > .glp-textarea:focus { outline: none; border-color: transparent; }
  .glp-inlinenum { display: flex; align-items: center; gap: 4px; flex: none; padding: 8px 8px 8px 0; }
  .glp-inlinenum .glp-numin { border: 0; background: transparent; width: 30px; padding: 0; text-align: right; }
  .glp-inlinenum .glp-numin:focus { outline: none; }
  .glp-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .glp-toggle { display: flex; align-items: center; gap: 8px; padding: 7px 0; cursor: pointer; }
  .glp-toggle input { accent-color: var(--accent); flex: none; }
  .glp-toggle b { font-weight: 500; color: var(--ink); font-size: 13px; }
  .glp-info {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; flex: none; border-radius: 50%;
    color: var(--ink-3); font-size: 12px; cursor: help;
  }
  .glp-info:hover, .glp-info:focus-visible { color: var(--ink-2); outline: none; }
  .glp-info__bubble {
    position: fixed; transform: translate(-50%, calc(-100% - 8px));
    width: 220px; max-width: 60vw; background: var(--panel-2); border: 1px solid var(--line-2);
    color: var(--ink-2); font-family: var(--font-ui); font-size: 12px; line-height: 1.45;
    border-radius: 8px; padding: 8px 10px; box-shadow: var(--shadow-lg);
    pointer-events: none; z-index: 200;
  }
  .glp-info__bubble::after {
    content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: var(--panel-2);
  }

  /* sub-block heading + granular style checkbox grid */
  .glp-sub {
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3);
    margin: 18px 0 8px;
  }
  .glp-sec__body > .glp-sub:first-child { margin-top: 2px; }
  .glp-checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin: 2px 0 12px; }
  .glp-check { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
  .glp-check input { accent-color: var(--accent); flex: none; }

  /* Appearance-style choice cards + grouped rows */
  .glp-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .glp-choice {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 0; border: 0; background: transparent;
    cursor: pointer; text-align: left; font-family: inherit; color: var(--ink);
  }
  .glp-choice__preview {
    display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; margin-bottom: 6px;
    border-radius: 10px; background: var(--panel-2); box-shadow: var(--hairline); transition: box-shadow 150ms ease;
  }
  .glp-choice:hover .glp-choice__preview { box-shadow: inset 0 0 0 1px var(--line-2); }
  .glp-choice.on .glp-choice__preview { box-shadow: inset 0 0 0 2px var(--accent); }
  .glp-choice__label { font-size: 13.5px; font-weight: 500; }
  .glp-choice__sub { font-size: 12px; color: var(--ink-3); }
  .glp-choice__aa { font-size: 24px; line-height: 1; }
  .glp-choice__dots { display: flex; gap: 6px; }
  .glp-choice__dots i { width: 16px; height: 16px; border-radius: 50%; background: var(--line-2); box-shadow: var(--hairline); }
  .glp-group { border-radius: 12px; background: var(--panel-2); box-shadow: var(--hairline); margin-bottom: 8px; }
  .glp-grow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; min-height: 48px; }
  .glp-grow + .glp-grow { box-shadow: inset 0 1px 0 var(--line); }
  .glp-grow__label { display: flex; flex-direction: column; min-width: 0; font-size: 13.5px; font-weight: 500; color: var(--ink); }
  .glp-grow__label > span { display: inline-flex; align-items: center; gap: 4px; }
  .glp-grow__label small { font-size: 12px; font-weight: 400; color: var(--ink-3); line-height: 16px; }
  .glp-grow__reset { font-size: 11px; padding: 2px 4px; }
  .glp-grow__control { flex: none; display: flex; justify-content: flex-end; max-width: 60%; }
  .glp-grow__control .glp-fontsel { width: 190px; }
  .glp-check__box { width: 16px; height: 16px; accent-color: var(--accent); }
  .glp-cval { display: flex; align-items: center; gap: 8px; width: 150px; padding: 3px 8px 3px 3px; border-radius: 6px; background: var(--field); border: 1px solid var(--line-2); }
  .glp-cval:focus-within { border-color: var(--accent); box-shadow: var(--focus-soft); }
  .glp-cval.bad { border-color: var(--danger); }
  .glp-cval__sw { position: relative; flex: none; width: 22px; height: 22px; border-radius: 5px; cursor: pointer; box-shadow: var(--hairline); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .glp-cval__sw.empty { background: var(--panel-2); color: var(--ink-3); font-size: 10px; }
  .glp-cval__sw input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .glp-cval__hex { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font-family: var(--font-mono); font-size: 12.5px; padding: 4px 0; outline: none; }
  .glp-cval__hex::placeholder { color: var(--ink-3); font-family: var(--font-ui); }
  .glp-sub--row { display: flex; align-items: center; justify-content: space-between; }
  .glp-modeswitch { display: inline-flex; gap: 2px; padding: 2px; border-radius: 999px; background: var(--bg); box-shadow: var(--hairline); text-transform: none; letter-spacing: 0; }
  .glp-modeswitch button { border: 0; background: transparent; color: var(--ink-3); width: 26px; height: 22px; border-radius: 999px; cursor: pointer; font-size: 11px; }
  .glp-modeswitch button.on { background: var(--panel); color: var(--accent); box-shadow: var(--hairline); }

  /* font picker (ReadMe's list) */
  .glp-fontsel { position: relative; min-width: 0; }
  .glp-fontsel__btn {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
    border: 1px solid var(--line-2); border-radius: 6px; background: var(--field); color: var(--ink);
    padding: 7px 10px; font-size: 14px; cursor: pointer; text-align: left;
  }
  .glp-fontsel__btn i { font-size: 10px; color: var(--ink-3); }
  .glp-fontsel__btn.on, .glp-fontsel__btn:hover { border-color: var(--accent); }
  .glp-fontsel__list {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 41; max-height: 340px; overflow-y: auto; padding: 5px;
    background: var(--panel); border-radius: 10px; box-shadow: var(--shadow-lg);
  }
  .glp-fontsel__list button {
    display: flex; align-items: baseline; gap: 8px; width: 100%; border: 0; background: transparent; color: var(--ink);
    padding: 8px 10px; border-radius: 7px; font-size: 15px; cursor: pointer; text-align: left;
  }
  .glp-fontsel__list button:hover { background: var(--panel-2); }
  .glp-fontsel__list button.on { background: var(--accent-soft); }
  .glp-fontsel__list button small { font-family: var(--font-ui); font-size: 12px; color: var(--ink-3); }
  .glp-fontsel__list button i { margin-left: auto; font-size: 11px; color: var(--accent); }
  .glp-fontsel__first { margin-bottom: 4px; box-shadow: 0 1px 0 var(--line); border-radius: 7px 7px 0 0 !important; }

  /* starter presets */
  .glp-presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .glp-preset {
    text-align: left; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--ink);
    border-radius: 10px; padding: 9px 11px; cursor: pointer; font-family: inherit;
    transition: border-color 120ms ease, background 120ms ease;
  }
  .glp-preset:hover { border-color: var(--accent); background: var(--accent-soft); }
  .glp-preset b { display: block; font-size: 12.5px; font-weight: 600; }
  .glp-preset span { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: 2px; line-height: 1.35; }

  /* icon picker */
  .glp-emojis { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .glp-emoji { font-size: 16px; line-height: 1; padding: 5px 7px; border: 1px solid var(--line-2); background: var(--field); border-radius: 7px; cursor: pointer; }
  .glp-emoji:hover { border-color: var(--ink-3); }
  .glp-emoji.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .glp-fagrid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; margin-top: 8px; }
  .glp-faicon { display: flex; align-items: center; justify-content: center; height: 30px; color: var(--ink-2); border: 1px solid var(--line-2); background: var(--field); border-radius: 7px; cursor: pointer; font-size: 14px; }
  .glp-faicon:hover { color: var(--ink); border-color: var(--ink-3); }
  .glp-faicon.on { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  /* autosave indicator */
  .glp-save { font-size: 12px; font-weight: 500; color: var(--ink-3); white-space: nowrap; }
  .glp-save.ok { color: var(--ok); }
  .glp-save.ok i { color: var(--ok-dot); }
  .glp-save.err { color: var(--danger); cursor: help; }

  .glp-slider { display: flex; align-items: center; gap: 10px; }
  .glp-slider input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
  .glp-numin {
    width: 62px; flex: none; background: var(--field); border: 1px solid var(--line-2); color: var(--ink);
    border-radius: 6px; padding: 5px 7px; font-family: var(--font-mono); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums;
  }
  .glp-numin:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus-soft); }
  .glp-numunit { font-size: 11.5px; color: var(--ink-3); flex: none; width: 16px; }

  .glp-card {
    border: 0;
    border-radius: 12px;
    margin-bottom: 10px;
    background: var(--panel-2);
    box-shadow: var(--hairline);
    overflow: hidden;
  }
  .glp-card__head {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px; cursor: pointer; user-select: none;
  }
  .glp-card__swatch { width: 12px; height: 12px; border-radius: 4px; flex: none; }
  .glp-card__name { font-weight: 600; font-size: 13.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .glp-namewrap { display: flex; align-items: center; gap: 4px; }
  .glp-namewrap__text { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .glp-namewrap__btn { font-size: 10.5px; opacity: 0; flex: none; }
  .glp-card__head:hover .glp-namewrap__btn, .glp-namewrap__btn:focus-visible { opacity: 1; }
  .glp-rename { flex: 1; min-width: 0; height: 26px; padding: 3px 8px; font-size: 13px; }
  .glp-drag-handle {
    flex: none; display: flex; align-items: center; color: var(--ink-3);
    cursor: grab; padding: 2px 2px 2px 0; font-size: 12px;
  }
  .glp-drag-handle:active { cursor: grabbing; }
  .glp-card__head.glp-drop-over { box-shadow: inset 0 2px 0 var(--accent); }
  .glp-card__meta { font-size: 11.5px; color: var(--ink-3); font-family: var(--font-mono); flex: 0 1 auto; min-width: 0; max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .glp-iconbtn {
    border: 0; background: transparent; color: var(--ink-3); cursor: pointer;
    font-size: 13px; padding: 3px 6px; border-radius: 5px; line-height: 1;
  }
  .glp-iconbtn:hover { background: var(--line); color: var(--ink); }
  .glp-iconbtn:disabled { opacity: .3; cursor: default; }
  .glp-card__head { position: relative; }
  .glp-rowacts {
    position: absolute; right: 34px; top: 50%; transform: translateY(-50%);
    display: flex; gap: 2px; padding-left: 18px; opacity: 0; pointer-events: none; transition: opacity 120ms ease;
    background: linear-gradient(90deg, transparent, var(--rowbg, var(--panel-2)) 18px);
  }
  .glp-card__head:hover > .glp-rowacts, .glp-card__head:focus-within > .glp-rowacts { opacity: 1; pointer-events: auto; }
  .glp-card__meta { transition: opacity 120ms ease; }
  .glp-card__head:hover > .glp-card__meta, .glp-card__head:focus-within > .glp-card__meta { opacity: 0; }
  .glp-chev i { font-size: 10px; transition: transform 150ms ease; }
  .glp-chev.open i { transform: rotate(90deg); }
  .glp button:focus-visible, .glp [role=button]:focus-visible, .glp-info:focus-visible {
    outline: none; box-shadow: var(--focus);
  }
  .glp-card__body { padding: 4px 12px 14px; border-top: 1px solid var(--line); }

  /* nested section container gets a subtle accent edge */
  .glp-section > .glp-card__head { --rowbg: color-mix(in oklch, var(--accent) 6%, var(--panel-2)); background: var(--rowbg); }
  .glp-section > .glp-card__body { padding: 8px 12px 14px; }

  .glp-swatches { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
  .glp-swatch {
    width: 26px; height: 26px; border-radius: 8px; cursor: pointer;
    border: 2px solid transparent; padding: 0;
  }
  .glp-swatch.on { border-color: var(--panel); box-shadow: 0 0 0 2px var(--accent); }
  .glp-swatch--custom {
    background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
    font-size: 0;
  }
  /* hex is the primary way to enter a color; a small native picker sits beside it */
  .glp-custom-pair { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .glp-hexrow { display: flex; align-items: center; gap: 8px; }
  .glp-hexrow > span { flex: none; width: 42px; font-size: 11px; color: var(--ink-3); }
  .glp-hex-wrap { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
  .glp-hex { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0;
    background: var(--field); border: 1px solid var(--line-2); border-radius: 8px; padding: 3px 6px 3px 3px; }
  .glp-hex:focus-within { border-color: var(--accent); box-shadow: var(--focus-soft); }
  .glp-hex--invalid { border-color: var(--danger); }
  .glp-hex__err { font-size: 11px; color: var(--danger); line-height: 1.3; }
  .glp-hex__sw { width: 24px; height: 24px; border-radius: 6px; flex: none; border: 1px solid var(--line-2); }
  .glp-hex__txt { flex: 1; min-width: 0; border: 0 !important; background: transparent !important; padding: 4px 2px !important;
    font-family: var(--font-mono); font-size: 12.5px; text-transform: uppercase; }
  .glp-hex__txt:focus { outline: none !important; }
  .glp-hex__pick { width: 26px; height: 24px; flex: none; padding: 0; border: 0; border-radius: 5px; background: transparent; cursor: pointer; }
  .glp-hex__pick::-webkit-color-swatch-wrapper { padding: 2px; }
  .glp-hex__pick::-webkit-color-swatch { border: 1px solid var(--line-2); border-radius: 4px; }

  .glp-seg { display: inline-flex; background: var(--bg); border: 0; box-shadow: var(--hairline); border-radius: 8px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .glp-seg button {
    border: 0; background: transparent; color: var(--ink-2);
    font-size: 12px; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-family: inherit;
  }
  .glp-seg button { white-space: nowrap; }
  .glp-seg button:hover { color: var(--ink); }
  .glp-seg button.on { background: var(--panel); color: var(--ink); font-weight: 500; box-shadow: var(--hairline), 0 1px 2px rgb(5 5 5 / 0.06); }
  .glp[data-ui="midnight"] .glp-seg button.on { background: var(--accent-soft); }

  .glp-peekitem { display: flex; gap: 6px; margin-bottom: 6px; }
  .glp-peekitem .glp-input { flex: 1; }
  .glp-iconrow { display: flex; gap: 6px; align-items: center; }
  .glp-iconrow .glp-input { flex: 1; min-width: 0; }
  .glp-iconpick {
    flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 9px;
    border: 1px solid var(--line-2); border-radius: 8px; background: var(--field); color: var(--ink); cursor: pointer; font-size: 15px;
  }
  .glp-iconpick:hover, .glp-iconpick.on { border-color: var(--accent); }
  .glp-iconpick__caret { font-size: 8px; color: var(--ink-3); }
  .glp-iconpop { margin-top: 8px; padding: 10px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel-2); }
  .glp-iconpop .glp-seg { margin-bottom: 8px; }
  .glp-linkrow .glp-input { min-width: 0; }

/* ---------- small reusable inputs ---------- */
function Field({ label, children, style, inline }) {
  /* link the label to a lone input/textarea child so clicking it focuses the field */
  const id = useId();
  const linkable = React.isValidElement(children) && (children.type === "input" || children.type === "textarea" || children.type === "select");
  return (
    <div className={"glp-field" + (inline ? " glp-field--inline" : "")} style={style}>
      <label htmlFor={linkable ? id : undefined}>{label}</label>
      {linkable ? React.cloneElement(children, { id: children.props.id || id }) : children}
    </div>
  );
}

function Seg({ value, options, onChange }) {
  return (
    <div className="glp-seg">
      {options.map((o) => (
        <button key={o.value} className={value === o.value ? "on" : ""} onClick={() => onChange(o.value)} type="button">
          {o.label}
        </button>
      ))}
    </div>
  );
}

function Slider({ label, value, min, max, step = 1, unit = "px", onChange }) {
  /* local text state lets the number field be edited freely (incl. temporarily
     empty, or values beyond the slider's range) without fighting the value */
  const [txt, setTxt] = useState(String(value));
  useEffect(() => { setTxt(String(value)); }, [value]);
  return (
    <Field label={label} inline>
      <div className="glp-slider">
        <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(Number(e.target.value))} />
        <input
          type="number"
          className="glp-numin"
          min={min}
          step={step}
          value={txt}
          onChange={(e) => {
            setTxt(e.target.value);
            const n = Number(e.target.value);
            if (e.target.value !== "" && Number.isFinite(n) && n >= min) onChange(n);
          }}
          onBlur={() => { if (txt === "" || !Number.isFinite(Number(txt))) setTxt(String(value)); }}
        />
        {unit ? <span className="glp-numunit">{unit}</span> : null}
      </div>
    </Field>
  );
}

/* like Slider, minus the drag track — for values you set once and forget (a size,
   a padding amount) rather than tune by eye against the live preview */
function NumberField({ label, value, min, max, step = 1, unit = "px", onChange }) {
  const [txt, setTxt] = useState(String(value));
  useEffect(() => { setTxt(String(value)); }, [value]);
  return (
    <Field label={label} inline>
      <div className="glp-slider">
        <input
          type="number"
          className="glp-numin"
          min={min}
          max={max}
          step={step}
          value={txt}
          onChange={(e) => {
            setTxt(e.target.value);
            const n = Number(e.target.value);
            if (e.target.value !== "" && Number.isFinite(n) && n >= min && (max == null || n <= max)) onChange(n);
          }}
          onBlur={() => { if (txt === "" || !Number.isFinite(Number(txt))) setTxt(String(value)); }}
        />
        {unit ? <span className="glp-numunit">{unit}</span> : null}
      </div>
    </Field>
  );
}

/* a bare number+unit stepper (no label, no wrapping Field) meant to sit inline inside
   another field's own row — e.g. a text input's size, folded into the same row as the
   text itself rather than a separate "Title size" row underneath it. `title` is the
   only accessible name, since there's no visible label. */
function InlineNum({ title, value, min, max, step = 1, unit = "px", onChange }) {
  const [txt, setTxt] = useState(String(value));
  useEffect(() => { setTxt(String(value)); }, [value]);
  return (
    <span className="glp-inlinenum" title={title}>
      <input
        type="number"
        className="glp-numin"
        aria-label={title}
        min={min}
        max={max}
        step={step}
        value={txt}
        onChange={(e) => {
          setTxt(e.target.value);
          const n = Number(e.target.value);
          if (e.target.value !== "" && Number.isFinite(n) && n >= min && (max == null || n <= max)) onChange(n);
        }}
        onBlur={() => { if (txt === "" || !Number.isFinite(Number(txt))) setTxt(String(value)); }}
      />
      {unit ? <span className="glp-numunit">{unit}</span> : null}
    </span>
  );
}

/* small "i" affordance that reveals `text` on hover/focus. Positioned via
   getBoundingClientRect + position:fixed (not CSS :hover + absolute) because several
   toggles live inside a .glp-card, whose overflow:hidden (needed to clip its own
   rounded corners) would otherwise cut an absolutely-positioned bubble off. */
function InfoTip({ text }) {
  const ref = useRef(null);
  const [pos, setPos] = useState(null);
  const show = () => {
    const r = ref.current.getBoundingClientRect();
    setPos({ left: r.left + r.width / 2, top: r.top });
  };
  const hide = () => setPos(null);
  return (
    <span
      ref={ref}
      className="glp-info"
      tabIndex={0}
      onMouseEnter={show}
      onMouseLeave={hide}
      onFocus={show}
      onBlur={hide}
    >
      <i className="fa-solid fa-circle-info" aria-hidden="true"></i>
      {pos && (
        <span className="glp-info__bubble" style={{ left: pos.left, top: pos.top }}>
          {text}
        </span>
      )}
    </span>
  );
}

/* compact single-line toggle — the description that used to sit always-visible
   underneath now lives in an InfoTip, so a row of toggles reads as a list instead
   of a stack of two-line paragraphs. */
function Toggle({ checked, onChange, label, hint, style }) {
  return (
    <label className="glp-toggle" style={style}>
      <input type="checkbox" checked={checked} onChange={(e) => onChange(e.target.checked)} />
      <b>{label}</b>
      {hint && <InfoTip text={hint} />}
    </label>
  );
}

function StyleCheck({ checked, label, onChange }) {
  return (
    <label className="glp-check">
      <input type="checkbox" checked={checked} onChange={(e) => onChange(e.target.checked)} />
      {label}
    </label>
  );
}

/* normalize loose hex entry (#abc, abc123, #ABC123) to #rrggbb, or null if invalid */
function normHex(v) {
  let s = String(v || "").trim().replace(/^#/, "");
  if (/^[0-9a-fA-F]{3}$/.test(s)) s = s.split("").map((c) => c + c).join("");
  return /^[0-9a-fA-F]{6}$/.test(s) ? "#" + s.toLowerCase() : null;
}

/* WCAG relative-luminance contrast ratio between two #rrggbb colors */
function relLum(hex) {
  const h = normHex(hex);
  if (!h) return null;
  const ch = [1, 3, 5].map((i) => {
    let v = parseInt(h.slice(i, i + 2), 16) / 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
}
function contrastRatio(a, b) {
  const la = relLum(a), lb = relLum(b);
  if (la == null || lb == null) return null;
  const hi = Math.max(la, lb), lo = Math.min(la, lb);
  return (hi + 0.05) / (lo + 0.05);
}
/* the card surface each accent sits on, per mode (matches the generated theme) */
const CARD_SURFACE = { light: "#ffffff", dark: "#151a21" };
/* readout for one accent vs its surface — 3:1 is WCAG AA for large/bold text & UI */
function ContrastNote({ color, surface, label }) {
  const r = contrastRatio(color, surface);
  if (r == null) return null;
  const ok = r >= 3;
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 4, color: ok ? "var(--ink-3)" : "var(--warn)" }}>
      {label} {r.toFixed(1)}:1 {ok ? <i className="fa-solid fa-check" aria-hidden="true"></i> : <i className="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>}
    </span>
  );
}

/* hex-first color input: type a hex code (primary), or nudge with the swatch picker */
function HexColor({ value, onChange }) {
  const [txt, setTxt] = useState(value);
  useEffect(() => { setTxt(value); }, [value]);
  const valid = normHex(txt);
  /* an in-progress edit (e.g. "#0B6") is invalid but not worth flagging as an error yet —
     only surface the hint once the field has settled without becoming a valid hex */
  const invalid = txt.trim() !== "" && !valid;
  return (
    <div className="glp-hex-wrap">
      <div className={"glp-hex" + (invalid ? " glp-hex--invalid" : "")}>
        <span className="glp-hex__sw" style={{ background: valid || value }} />
        <input
          className="glp-input glp-hex__txt"
          value={txt}
          spellCheck={false}
          placeholder="#0B63C5"
          onChange={(e) => { setTxt(e.target.value); const h = normHex(e.target.value); if (h) onChange(h); }}
          onBlur={() => { if (!txt.trim()) setTxt(value); }}
        />
        <input type="color" className="glp-hex__pick" value={normHex(value) || "#000000"} onChange={(e) => onChange(e.target.value)} title="Pick a color" />
      </div>
      {invalid && <span className="glp-hex__err">Not a valid hex color. Try #RRGGBB</span>}
    </div>
  );
}

/* icon input — emoji character or a Font Awesome icon name + style */
function IconField({ label, obj, onChange }) {
  const type = obj.iconType || "emoji";
  const [open, setOpen] = useState(false);
  const setType = (v) => {
    /* switching type while keeping an incompatible value silently produces
       garbage (e.g. fa-solid fa-📘) with no visible error, so reseed a sane
       default, but only when the current value wouldn't work as-is */
    const cur = (obj.icon || "").trim();
    const looksEmoji = /[\u{1F000}-\u{1FFFF}☀-➿]/u.test(cur);
    const looksFaSlug = /^[a-z][a-z0-9-]*$/i.test(cur);
    const icon = v === "fa" && !looksFaSlug ? "book" : v === "emoji" && !looksEmoji ? "📘" : cur;
    onChange({ iconType: v, icon });
  };
  return (
    <Field label={label}>
      <div className="glp-iconrow">
        <button type="button" className={"glp-iconpick" + (open ? " on" : "")} title="Choose an icon" aria-label="Choose an icon" aria-expanded={open} onClick={() => setOpen(!open)}>
          {type === "fa" ? <i className={"fa-" + (obj.faStyle || "solid") + " fa-" + String(obj.icon || "").replace(/^fa-/, "")} aria-hidden="true"></i> : <span>{obj.icon}</span>}
          <i className="fa-solid fa-chevron-down glp-iconpick__caret" aria-hidden="true"></i>
        </button>
        <input
          className="glp-input"
          value={obj.icon}
          onChange={(e) => onChange({ icon: e.target.value })}
          placeholder={type === "fa" ? "Font Awesome name, e.g. rocket" : "Emoji"}
          title={type === "fa" ? "Any Font Awesome name, without the fa- prefix. Light and duotone are Pro-only." : undefined}
        />
        {type === "fa" && (
          <select className="glp-select" style={{ width: 92, flex: "none" }} value={obj.faStyle || "solid"} onChange={(e) => onChange({ faStyle: e.target.value })} aria-label="Icon style">
            <option value="solid">Solid</option>
            <option value="regular">Regular</option>
            <option value="light">Light</option>
            <option value="brands">Brands</option>
          </select>
        )}
      </div>
      {open && (
        <div className="glp-iconpop">
          <Seg value={type} onChange={setType} options={[{ value: "fa", label: "Font Awesome" }, { value: "emoji", label: "Emoji" }]} />
          {type === "emoji" ? (
            <div className="glp-emojis">
              {EMOJI_COMMON.map((e) => (
                <button key={e} type="button" aria-label={`Icon: ${e}`} className={"glp-emoji" + (obj.icon === e ? " on" : "")} onClick={() => { onChange({ icon: e }); setOpen(false); }}>
                  {e}
                </button>
              ))}
            </div>
          ) : (
            <div className="glp-fagrid">
              {FA_COMMON.map((n) => (
                <button key={n} type="button" title={n} aria-label={`Icon: ${n}`} className={"glp-faicon" + (obj.icon === n ? " on" : "")} onClick={() => { onChange({ icon: n }); setOpen(false); }}>

                </button>
              ))}
            </div>
          )}
        </div>
      )}
    </Field>
  );
}

/* ---------- ReadMe Appearance-style building blocks ----------
   ChoiceCards: "Default vs Custom" picker cards with a small preview.
   SettingsGroup / SettingsRow: the rounded list of label-left rows. */
function ChoiceCards({ value, onChange, options }) {
  return (
    <div className="glp-choices" role="radiogroup">
      {options.map((o) => (
        <button key={o.value} type="button" role="radio" aria-checked={value === o.value} className={"glp-choice" + (value === o.value ? " on" : "")} onClick={() => onChange(o.value)}>
          <span className="glp-choice__preview">{o.preview}</span>
          <span className="glp-choice__label">{o.label}</span>
          {o.sub && <span className="glp-choice__sub">{o.sub}</span>}

function SettingsGroup({ children }) {

}
function SettingsRow({ label, hint, onReset, children }) {

        <span>
          {label}
