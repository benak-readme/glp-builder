                      {(fileState === "off" || fileState === "error") && (
                        <>
                          <button className="glp-pages__item" type="button" onClick={connectNewFile}>
                            <i className="fa-solid fa-hard-drive" aria-hidden="true"></i>
                            <span><b>Keep a backup file</b><small>Every change also saves to a .json file you choose, so clearing your browser never loses pages.</small></span>
                          </button>
                          <button className="glp-pages__item" type="button" onClick={openExistingFile}>
                            <i className="fa-solid fa-folder-open" aria-hidden="true"></i>
                            <span><b>Open a backup file</b><small>Restore pages from a file and keep it in sync.</small></span>
                          </button>
                        </>
                      )}
                      <div className="glp-pages__actions" style={{ borderTop: 0, marginTop: 0 }}>
                        <button className="glp-smallbtn" type="button" onClick={exportDesigns}><i className="fa-solid fa-download" aria-hidden="true"></i> Export all</button>
                        <button className="glp-smallbtn" type="button" onClick={() => importInput.current && importInput.current.click()}><i className="fa-solid fa-upload" aria-hidden="true"></i> Import</button>
                        <input ref={importInput} type="file" accept=".json,application/json" style={{ display: "none" }}
                          onChange={(e) => { importDesigns(e.target.files[0]); e.target.value = ""; }} />
                      </div>
                      {fileMsg && <div className="glp-filemsg">{fileMsg}</div>}
                    </div>
                    </>
                  )}
                </div>
              </>
            )}
          </div>
          <button className={"glp-smallbtn" + (shared === true ? " done" : "")} onClick={share} type="button" disabled={shared === "working"} style={{ padding: "8px 13px" }}>
            {shared === "working" ? (
              "Creating link…"
            ) : shared === true ? (
              <><i className="fa-solid fa-check" aria-hidden="true"></i> Link copied</>
            ) : (
              <><i className="fa-solid fa-link" aria-hidden="true"></i> Share link</>
            )}
          </button>
          <button className="glp-smallbtn" onClick={download} type="button" style={{ padding: "8px 13px" }}>
            <i className="fa-solid fa-download" aria-hidden="true"></i> Download
          </button>
          <button className={"glp-copy" + (copied ? " done" : "")} onClick={copy} type="button">
            {copied ? <><i className="fa-solid fa-check" aria-hidden="true"></i> Copied</> : <><i className="fa-solid fa-copy" aria-hidden="true"></i> Copy HTML</>}
          </button>
        </div>
      </div>

      {sharedView && (
        <div className="glp-banner">
          <span>{shareError ? "Couldn't load that shared design. It may have been removed, so you're seeing a blank starter page." : "You're viewing a shared design. It won't be kept until you add it to your pages."}</span>
          <button className="glp-smallbtn" type="button" onClick={saveSharedAsPage}>Save as a page</button>
        </div>
      )}

      <div className="glp-main">
        {tab === "build" ? (
          <>
            <div className="glp-side" ref={sideRef}>
              <NavTabs openNav={openNav} setOpenNav={setOpenNav} />
              {override !== null && (
                <div className="glp-banner" style={{ borderRadius: 10, border: "1px solid var(--warn-line)", marginBottom: 16 }}>
                  <span>Manual code edits are active. Copy HTML exports your edited code, not these settings.</span>
                  <button className="glp-smallbtn" type="button" onClick={discardOverride}>
                    Discard edits
                  </button>
                </div>
              )}

              <NavSection id="theme" label="Theme Editor" openNav={openNav} setOpenNav={setOpenNav}>
                <div className="glp-sub" style={{ marginTop: 4 }}>Quick start</div>
                <div className="glp-presets">
                  {PRESETS.map((p) => (
                    <button key={p.key} type="button" className="glp-preset" title={p.hint} onClick={() => applyPreset(p)}>
                      <b>{p.label}</b>
                      <span>{p.hint}</span>
                    </button>
                  ))}
                </div>

                <div className="glp-sub">Global card style</div>
                <div className="glp-note" style={{ marginBottom: 12 }}>
                  The default look for every card section set to <b>Global</b>. Individual sections can override it by switching to <b>Custom</b>.
                </div>
                <CardStyleControls style={config.cardStyle || DEFAULT_STYLE} setStyle={setCardStyle} />

                <div className="glp-sub">Typography</div>
                <ChoiceCards
                  value={config.typeface.custom ? "custom" : "readme"}
                  onChange={(v) => setConfig((c) => ({ ...c, typeface: { ...c.typeface, custom: v === "custom" } }))}
                  options={[
                    { value: "readme", label: "Match ReadMe", sub: "Default", preview: <span className="glp-choice__aa">Aa</span> },
                    { value: "custom", label: "Custom", sub: "Pick fonts", preview: <span className="glp-choice__aa" style={{ fontFamily: "var(--font-display)", fontStyle: "italic" }}>Aa</span> },
                  ]}
                />
                {config.typeface.custom && (
                  <SettingsGroup>
                    <SettingsRow label="Headings">
                      <FontSelect bare label="Headings" value={config.typeface.heading} options={HEADING_FONTS}
                        onChange={(v) => setConfig((c) => ({ ...c, typeface: { ...c.typeface, heading: v } }))} />
                    </SettingsRow>
                    <SettingsRow label="Body & UI">
                      <FontSelect bare label="Body & UI" value={config.typeface.body} options={BODY_FONTS}
                        onChange={(v) => setConfig((c) => ({ ...c, typeface: { ...c.typeface, body: v } }))} />
                    </SettingsRow>
                    <SettingsRow label="Code" hint="Eyebrows, labels, small buttons">
                      <FontSelect bare label="Code" value={config.typeface.mono || "readme"} options={CODE_FONTS} firstLabel="Automatic" firstSub="Matches your fonts"
                        onChange={(v) => setConfig((c) => { const t = { ...c.typeface }; if (v === "readme") delete t.mono; else t.mono = v; return { ...c, typeface: t }; })} />
                    </SettingsRow>
                  </SettingsGroup>
                )}

                <div className="glp-sub glp-sub--row">
                  <span>Colors</span>
                  {config.theme.colorMode === "custom" && (
                    <span className="glp-modeswitch" role="group" aria-label="Edit colors for">
                      <button type="button" className={colorEdit === "light" ? "on" : ""} aria-pressed={colorEdit === "light"} title="Edit light-mode colors" onClick={() => { setColorEdit("light"); setMode("light"); }}>
                        <i className="fa-solid fa-sun" aria-hidden="true"></i>
                      </button>
                      <button type="button" className={colorEdit === "dark" ? "on" : ""} aria-pressed={colorEdit === "dark"} title="Edit dark-mode colors" onClick={() => { setColorEdit("dark"); setMode("dark"); }}>
                        <i className="fa-solid fa-moon" aria-hidden="true"></i>
                      </button>
                    </span>
                  )}
                </div>
                <ChoiceCards
                  value={config.theme.colorMode}
                  onChange={(v) => setTheme({ colorMode: v })}
                  options={[
                    { value: "readme", label: "Match ReadMe", sub: "Default", preview: <span className="glp-choice__dots"><i style={{ background: "var(--accent-fill)" }}></i><i></i><i></i></span> },
                    { value: "custom", label: "Custom", sub: "Set each color", preview: <span className="glp-choice__dots"><i style={{ background: config.theme.colors.light.brand || "#FF4C00" }}></i><i style={{ background: config.theme.colors.light.heading || "#1F1F1F" }}></i><i style={{ background: config.theme.colors.light.cardBg || "#FFFFFF" }}></i></span> },
                  ]}
                />
                {config.theme.colorMode === "custom" && (
                  <>
                    <SettingsGroup>
                      {COLOR_ROLES.map((r) => {
                        const v = config.theme.colors[colorEdit][r.key];
                        const setRole = (val) => setConfig((c) => ({ ...c, theme: { ...c.theme, colors: { ...c.theme.colors, [colorEdit]: { ...c.theme.colors[colorEdit], [r.key]: val } } } }));
                        return (
                          <SettingsRow key={r.key} label={r.label} hint={r.hint} onReset={v ? () => setRole("") : null}>
                            <ColorValue value={v} onChange={setRole} label={r.label} />
                          </SettingsRow>

                      })}
                    </SettingsGroup>
                    <p className="glp-hint" style={{ margin: "6px 0 0" }}>
                      {colorEdit === "light" ? "Light mode. " : "Dark mode (unset colors keep the default dark look). "}
                      {!config.theme.colors.light.brand && !config.theme.colors.dark.brand ? "With no brand color, each card keeps its own accent." : ""}
                    </p>
                  </>
                )}

                <div className="glp-sub">Page</div>
                <SettingsGroup>
                  <SettingsRow label="Background pattern" hint="Faint full-width line art">
                    <input type="checkbox" className="glp-check__box" checked={!!config.theme.pattern} onChange={(e) => setTheme({ pattern: e.target.checked })} aria-label="Background pattern" />
                  </SettingsRow>
                  <SettingsRow label="Page width">
                    <Seg
                      value={config.layout.maxW}
                      onChange={(v) => setLayout({ maxW: v })}
                      options={[
                        { value: 960, label: "Narrow" },
                        { value: 1120, label: "Default" },
                        { value: 1280, label: "Wide" },
                      ]}
                    />
                  </SettingsRow>
                </SettingsGroup>
              </NavSection>

              <NavSection id="headerFooter" label="Header & Footer" openNav={openNav} setOpenNav={setOpenNav}>

                  <Seg
                    value={config.brandBar.enabled ? "brand" : config.headerImage.enabled ? "image" : config.flattenHeader ? "transparent" : "native"}
                    onChange={(v) =>
                      setConfig((c) => {
                        const brand = v === "brand";
                        /* searchMode is left as chosen; effSearchMode maps it to a placement
                           that works with this header, and restores it if the brand bar goes */
                        return {
                          ...c,
                          flattenHeader: v === "transparent" || v === "image",
                          headerImage: { ...c.headerImage, enabled: v === "image" },

                  <Seg
                    value={effSearchMode(config)}
                    onChange={(v) => patch({ searchMode: v })}
                    options={

                            { value: "hero", label: "Under hero" },
                            { value: "brand", label: "In brand bar" },

                            { value: "native", label: "Native header" },
                            { value: "header", label: "Centered in header" },
                            { value: "hero", label: "Under hero" },

                {config.brandBar.enabled && (
                  <>

                    </div>
                    <Field label="Logo URL (optional, replaces wordmark)">
                      <input className="glp-input" value={config.brandBar.logoUrl} onChange={(e) => setBrandBar({ logoUrl: e.target.value })} placeholder="https://files.readme.io/…/logo.svg" />
                    </Field>
                    <Field label="Nav links">
                      <LinkListEditor links={config.brandBar.links} onChange={(links) => setBrandBar({ links })} max={7} labelPh="Guides" hrefPh="/guides" />
                    </Field>
                    <Toggle
                      checked={config.brandBar.button.enabled}
                      onChange={(v) => setBrandBar({ button: { ...config.brandBar.button, enabled: v } })}

                      <div className="glp-row2">
                        <Field label="Button label">
                          <input className="glp-input" value={config.brandBar.button.label} onChange={(e) => setBrandBar({ button: { ...config.brandBar.button, label: e.target.value } })} />
                        </Field>
                        <Field label="Button link">
                          <input className="glp-input" value={config.brandBar.button.href} onChange={(e) => setBrandBar({ button: { ...config.brandBar.button, href: e.target.value } })} />
                        </Field>
                      </div>
                    )}
                  </>
                )}
                {config.headerImage.enabled && (
                  <>
                    <Field label="Image URL">
                      <input className="glp-input" value={config.headerImage.url} onChange={(e) => setHeaderImage({ url: e.target.value })} placeholder="https://…/banner.jpg" />
                    </Field>
                    <Slider label="Image height" value={config.headerImage.height} min={160} max={720} step={4} onChange={(v) => setHeaderImage({ height: v })} />
                    <Slider label="Header overlap" value={config.headerImage.offset} min={0} max={160} step={4} onChange={(v) => setHeaderImage({ offset: v })} />
                    <Slider label="Darken (tint)" value={config.headerImage.tint} min={0} max={80} unit="%" onChange={(v) => setHeaderImage({ tint: v })} />
                  </>
                )}

                <div className="glp-sub">Contact banner</div>
                <Toggle
                  checked={config.banner.enabled}
                  onChange={(v) => setBanner({ enabled: v })}
                  label="Show a banner below the cards"
                  hint='Full-width call-to-action, e.g. "Need help building your integration?"'
                />
                {config.banner.enabled && (
                  <>
                    <Field label="Banner title">
                      <input className="glp-input" value={config.banner.title} onChange={(e) => setBanner({ title: e.target.value })} />
                    </Field>
                    <Field label="Banner text">
                      <textarea className="glp-textarea" value={config.banner.text} onChange={(e) => setBanner({ text: e.target.value })} />
                    </Field>
                    <div className="glp-row2">
                      <Field label="Button label">
                        <input className="glp-input" value={config.banner.btnLabel} onChange={(e) => setBanner({ btnLabel: e.target.value })} />
                      </Field>
                      <Field label="Button link">
                        <input className="glp-input" value={config.banner.btnHref} onChange={(e) => setBanner({ btnHref: e.target.value })} />
                      </Field>
                    </div>
                  </>
                )}

                <div className="glp-sub">Footer</div>
                <Field label="Footer line (blank to hide)">
                  <input className="glp-input" value={config.footer} onChange={(e) => patch({ footer: e.target.value })} />
                </Field>
              </NavSection>

              <NavSection id="hero" label="Hero" openNav={openNav} setOpenNav={setOpenNav}>
                <Field label="Eyebrow (blank to hide)">
                  <input
                    className="glp-input"
                    value={config.hero.eyebrow}
                    onChange={(e) => setHero({ eyebrow: e.target.value })}
                    placeholder="e.g. Documentation center"
                  />
                </Field>
                <div className="glp-row2">
                  <Field label="Announcement chip (blank to hide)">
                    <input
                      className="glp-input"
                      value={config.hero.chip}
                      onChange={(e) => setHero({ chip: e.target.value })}
                      placeholder="e.g. v2.4 is now available"
                    />
                  </Field>
                  <Field label="Chip link (optional)">
                    <input className="glp-input" value={config.hero.chipHref} onChange={(e) => setHero({ chipHref: e.target.value })} placeholder="/changelog" />
                  </Field>
                </div>
                <Field label="Page title">
                  <div className="glp-fieldrow">
                    <input className="glp-input" value={config.hero.title} onChange={(e) => setHero({ title: e.target.value })} />
                    <InlineNum
                      title="Title size"
                      value={config.hero.titleSize != null ? config.hero.titleSize : (config.hero.align === "left" ? 42 : 38)}
                      min={22}
                      max={72}
                      onChange={(v) => setHero({ titleSize: v })}
                    />
                  </div>
                </Field>
                <Field label="Subtitle">
                  <div className="glp-fieldrow">
                    <textarea className="glp-textarea" value={config.hero.subtitle} onChange={(e) => setHero({ subtitle: e.target.value })} />
                    <InlineNum
                      title="Subtitle size"
                      value={config.hero.subtitleSize != null ? config.hero.subtitleSize : HERO_SUB_DEFAULT}
                      min={12}
                      max={26}
                      onChange={(v) => setHero({ subtitleSize: v })}
                    />
                  </div>
                </Field>
                <Field label="Alignment" inline>
                  <Seg
                    value={config.hero.align}
                    onChange={(v) => setHero({ align: v })}
                    options={[
                      { value: "center", label: "Centered" },
                      { value: "left", label: "Left" },
                    ]}
                  />
                </Field>
                {effSearchMode(config) === "hero" && (
                  <Field label="Line under the search row (blank to hide)">
                    <input
                      className="glp-input"
                      value={config.hero.searchHint}
                      onChange={(e) => setHero({ searchHint: e.target.value })}
                      placeholder="Search covers every doc set below. Ask AI answers with links to its sources."
                    />
                  </Field>
                )}
                <NumberField label="Vertical padding" value={config.hero.padY || 0} min={0} max={160} step={4} onChange={(v) => setHero({ padY: v })} />
                <Toggle
                  checked={config.hero.buttons}
                  onChange={(v) => setHero({ buttons: v })}
                  label="Hero buttons"
                  hint="Primary + secondary call-to-action under the subtitle."
                />
                {config.hero.buttons && (
                  <>
                    <div className="glp-row2">
                      <Field label="Primary label">
                        <input
                          className="glp-input"
                          value={config.hero.btnPrimary.label}
                          onChange={(e) => setHero({ btnPrimary: { ...config.hero.btnPrimary, label: e.target.value } })}
                        />
                      </Field>
                      <Field label="Primary link">
                        <input
                          className="glp-input"
                          value={config.hero.btnPrimary.href}
                          onChange={(e) => setHero({ btnPrimary: { ...config.hero.btnPrimary, href: e.target.value } })}
                        />
                      </Field>
                    </div>
                    <div className="glp-row2">
                      <Field label="Secondary label">
                        <input
                          className="glp-input"
                          value={config.hero.btnSecondary.label}
                          onChange={(e) => setHero({ btnSecondary: { ...config.hero.btnSecondary, label: e.target.value } })}
                        />
                      </Field>
                      <Field label="Secondary link">
                        <input
                          className="glp-input"
                          value={config.hero.btnSecondary.href}
                          onChange={(e) => setHero({ btnSecondary: { ...config.hero.btnSecondary, href: e.target.value } })}
                        />
                      </Field>
                    </div>
                  </>
                )}
                <Toggle
                  checked={config.ticker.enabled}
                  onChange={(v) => setTicker({ enabled: v })}
                  label="Announcement ticker"
                  hint="Scrolling marquee strip at the very top."
                />
                {config.ticker.enabled && (
                  <Field label="Ticker text (repeats automatically)">
                    <input className="glp-input" value={config.ticker.text} onChange={(e) => setTicker({ text: e.target.value })} />
                  </Field>
                )}
              </NavSection>

              <NavSection id="sections" label="Sections" openNav={openNav} setOpenNav={setOpenNav}>
                {config.sections.map((section, i) => (
                  <SectionEditor
                    key={section.id}
                    section={section}
                    index={i}
                    count={config.sections.length}
                    hideAccents={config.theme.colorMode !== "custom" || !!(config.theme.colors.light.brand || config.theme.colors.dark.brand)}
                    globalStyle={config.cardStyle || DEFAULT_STYLE}
                    open={openSection === section.id}
                    onToggle={() => setOpenSection(openSection === section.id ? null : section.id)}
                    onMove={(dir) => moveSection(section.id, dir)}
                    onRemove={() => removeSection(section.id)}
                    onDuplicate={() => duplicateSection(section.id)}
                    onChange={(next) => updateSection(section.id, next)}
                    cardOps={cardOpsFor(section.id)}
                    openCard={openCard}
                    setOpenCard={setOpenCard}
                    dragHandleProps={sectionDrag.dragHandleProps(section.id)}
                    dropRowProps={sectionDrag.dropRowProps(i)}
                    dragOver={sectionDrag.overIndex === i}
                  />
                ))}
                <button className="glp-add" type="button" onClick={addSection} disabled={config.sections.length >= 6}>
                  + Add section ({config.sections.length}/6)
                </button>
              </NavSection>
            </div>
            <Preview html={override !== null ? generated : previewHtml} mode={mode} setMode={setMode} device={device} setDevice={setDevice} liquidNote={hasLiquid} focusIndex={(() => { const fi = config.sections.findIndex((s) => s.id === openSection); return fi >= 0 ? fi : null; })()} />
          </>
        ) : (
          <>
            <div className="glp-code">
              {override !== null && (
                <div className="glp-banner">
                  <span>Edited by hand. Builder changes won't apply until you sync.</span>
                  <button className="glp-smallbtn" type="button" onClick={discardOverride}>
                    Sync from builder
                  </button>
                </div>
              )}
              <div className="glp-code__bar">
                <span className="glp-view__label">Raw HTML{hasLiquid && !override ? " + Liquid" : ""}</span>
                {hasLiquid && !override && <span className="glp-chip glp-chip--liquid">liquid</span>}
                <span className={"glp-chip" + (override !== null ? " glp-chip--warn" : "")}>
                  {override !== null ? "manual edits" : "generated from builder"}
                </span>
                <span className="glp-chip">{(exportHtml.length / 1024).toFixed(1)} KB</span>
              </div>
              <textarea spellCheck={false} value={exportHtml} onChange={(e) => setOverride(e.target.value)} />
            </div>
            <Preview html={exportHtml} mode={mode} setMode={setMode} device={device} setDevice={setDevice} liquidNote={hasLiquid && !override} />
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
